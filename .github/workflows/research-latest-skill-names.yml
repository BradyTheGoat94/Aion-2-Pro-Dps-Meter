name: Research latest numeric skill names

on:
  pull_request:
    branches: [ main ]

jobs:
  lookup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public Aion2Flow data
        run: git clone --depth 1 https://github.com/cloris-chan/Aion2Flow.git /tmp/Aion2Flow
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install LZ4
        run: python -m pip install lz4
      - name: Decode English skill-name resource
        shell: bash
        run: |
          python - <<'PY'
          import struct
          from pathlib import Path
          import lz4.block

          requested=[1223380,3000020,1223730,1223700,1217410,1200015,1223470,1217530,1231910,1231890,1223500,1217560,1230010,1223490,1217570,1231100,1231120,1231880,1910251,1223400,1223480,1223410,1223720,1240500,1231110,1230040,1231921,1231920]
          data=Path('/tmp/Aion2Flow/src/Aion2Flow.Resources/Packs/en-US.bin').read_bytes()
          pack_magic,version,kind,reserved,uncompressed_len,checksum,compressed_len=struct.unpack_from('<IHBBiQi',data,0)
          assert (pack_magic,version,kind)==(0x50523241,14,2)
          payload=lz4.block.decompress(data[24:24+compressed_len],uncompressed_size=uncompressed_len)
          payload_magic,payload_version=struct.unpack_from('<IH',payload,0)
          assert (payload_magic,payload_version)==(0x44523241,14)
          section_count=struct.unpack_from('<i',payload,6)[0]
          pos=10
          headers=[]
          for _ in range(section_count):
              sid,count,length,section_checksum=struct.unpack_from('<HiiQ',payload,pos)
              pos+=18
              headers.append((sid,count,length))
          data_pos=pos
          names={}
          for sid,count,length in headers:
              section=payload[data_pos:data_pos+length]
              data_pos+=length
              if sid!=101:
                  continue
              p=0
              for _ in range(count):
                  skill_id,name_len=struct.unpack_from('<ii',section,p)
                  p+=8
                  encoded=section[p:p+name_len]
                  p+=name_len
                  names[skill_id]=bytes(b^0x22 for b in encoded).decode('utf-8')
          for skill_id in requested:
              print(f'AION2FLOW_SKILL|{skill_id}|{names.get(skill_id, "<MISSING>")}')
          PY
