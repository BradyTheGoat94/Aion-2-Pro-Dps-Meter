name: Research monster log numeric skill names

on:
  pull_request:
    branches: [ main ]

jobs:
  lookup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public Aion2Flow data
        run: git clone --depth 1 https://github.com/cloris-chan/Aion2Flow.git /tmp/Aion2Flow
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install LZ4
        run: python -m pip install lz4
      - name: Decode English skill-name resource
        shell: bash
        run: |
          python - <<'PY'
          import struct
          from pathlib import Path
          import lz4.block
          requested=[1200015,1230115,1230125,1607630,1607660,1607670,1607740,3000017]
          data=Path('/tmp/Aion2Flow/src/Aion2Flow.Resources/Packs/en-US.bin').read_bytes()
          pm,v,k,r,u,cs,cl=struct.unpack_from('<IHBBiQi',data,0)
          assert (pm,v,k)==(0x50523241,14,2)
          payload=lz4.block.decompress(data[24:24+cl],uncompressed_size=u)
          assert struct.unpack_from('<IH',payload,0)==(0x44523241,14)
          sc=struct.unpack_from('<i',payload,6)[0]
          pos=10; headers=[]
          for _ in range(sc):
              sid,count,length,checksum=struct.unpack_from('<HiiQ',payload,pos); pos+=18
              headers.append((sid,count,length))
          names={}; data_pos=pos
          for sid,count,length in headers:
              section=payload[data_pos:data_pos+length]; data_pos+=length
              if sid!=101: continue
              p=0
              for _ in range(count):
                  skill_id,name_len=struct.unpack_from('<ii',section,p); p+=8
                  encoded=section[p:p+name_len]; p+=name_len
                  names[skill_id]=bytes(b^0x22 for b in encoded).decode('utf-8')
          for skill_id in requested:
              print(f'AION2FLOW_SKILL|{skill_id}|{names.get(skill_id, "<MISSING>")}')
          PY
