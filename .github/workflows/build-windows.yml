      - name: Add public AION 2 game data catalog
        if: env.SOURCE_FROM_ARCHIVE == 'true'
        shell: pwsh
        run: |
          $catalog = @(
            'using System.IO;',
            'using System.Net.Http;',
            'using System.Text.Json;',
            '',
            'namespace Aion2DPSPro.Protocol;',
            '',
            'internal static class PublicGameData',
            '{',
            '    private static readonly object Sync = new();',
            '    private static Dictionary<int,string>? skills;',
            '    private static bool attempted;',
            '    private static readonly string CachePath = Path.Combine(Environment.GetFolderPath(Environment.SpecialFolder.LocalApplicationData), "Aion2DPSPro", "meter-bootstrap.json");',
            '',
            '    public static string SkillName(int raw)',
            '    {',
            '        EnsureLoaded();',
            '        if (skills is not null)',
            '        {',
            '            if (skills.TryGetValue(raw, out var exact)) return exact;',
            '            int r10 = raw / 10 * 10;',
            '            if (r10 != raw && skills.TryGetValue(r10, out var n10)) return n10;',
            '            int r10k = raw / 10000 * 10000;',
            '            if (r10k != raw && skills.TryGetValue(r10k, out var n10k)) return n10k;',
            '            // Observed combat IDs encode rank/variant data in the low digits.',
            '            // Example: 11010340 -> public catalog base 11010000.',
            '            int r100k = raw / 100000 * 100000;',
            '            if (r100k != raw && skills.TryGetValue(r100k, out var n100k)) return n100k;'
            '        }',
            '        return "Skill " + raw;',
            '    }',
            '',
            '    private static void EnsureLoaded()',
            '    {',
            '        if (attempted) return;',
            '        lock (Sync)',
            '        {',
            '            if (attempted) return;',
            '            attempted = true;',
            '            string? json = null;',
            '            try',
            '            {',
            '                using var http = new HttpClient { Timeout = TimeSpan.FromSeconds(5) };',
            '                json = http.GetStringAsync("https://api.aion2meter.com/api/gamedata/meter-bootstrap").GetAwaiter().GetResult();',
            '                Directory.CreateDirectory(Path.GetDirectoryName(CachePath)!);',
            '                File.WriteAllText(CachePath, json);',
            '            }',
            '            catch',
            '            {',
            '                try { if (File.Exists(CachePath)) json = File.ReadAllText(CachePath); } catch { }',
            '            }',
            '            if (string.IsNullOrWhiteSpace(json)) return;',
            '            try',
            '            {',
            '                using var doc = JsonDocument.Parse(json);',
            '                var map = new Dictionary<int,string>();',
            '                // meter-bootstrap has changed shape over time. Walk the JSON',
            '                // recursively and accept either {code,name} or {id,name}.',
            '                CollectSkills(doc.RootElement, map);',
            '                skills = map;',
            '            }',
            '            catch { }',
            '        }',
            '    }',
            '',
            '    private static void CollectSkills(JsonElement node, Dictionary<int,string> map)',
            '    {',
            '        if (node.ValueKind == JsonValueKind.Object)',
            '        {',
            '            int code = 0;',
            '            if (node.TryGetProperty("code", out var c)) c.TryGetInt32(out code);',
            '            if (code == 0 && node.TryGetProperty("id", out var id)) id.TryGetInt32(out code);',
            '            if (code > 0 && node.TryGetProperty("name", out var n))',
            '            {',
            '                var name = n.GetString();',
            '                if (!string.IsNullOrWhiteSpace(name)) map[code] = name;',
            '            }',
            '            foreach (var p in node.EnumerateObject()) CollectSkills(p.Value, map);',
            '        }',
            '        else if (node.ValueKind == JsonValueKind.Array)',
            '            foreach (var item in node.EnumerateArray()) CollectSkills(item, map);',
            '    }',
            '}'
          ) -join [Environment]::NewLine
          Set-Content "src/Protocol/PublicGameData.cs" $catalog

          $p = "src/Protocol/PacketDispatcher.cs"
          $d = Get-Content $p -Raw

          # Do not depend on the exact formatting/body of the older SkillName helper.
          # Replace the helper body when present; otherwise add a wrapper immediately
          # before ReadV. This keeps the patch compatible with the extracted v5 source
          # and with earlier workflow-generated variants.
          $methodPattern = '(?ms)^\s*private static string SkillName\s*\(\s*int\s+skill\s*\)\s*\{.*?^\s*\}'
          if ([regex]::IsMatch($d, $methodPattern)) {
            $replacement = '    private static string SkillName(int skill)' + [Environment]::NewLine +
                           '    {' + [Environment]::NewLine +
                           '        return PublicGameData.SkillName(skill);' + [Environment]::NewLine +
                           '    }'
            $d = [regex]::Replace($d, $methodPattern, $replacement, 1)
          }
          elseif ($d -notmatch 'PublicGameData\.SkillName') {
            $readAnchor = '    private static bool ReadV('
            if (-not $d.Contains($readAnchor)) { throw "ReadV anchor missing for public skill catalog" }
            $wrapper = '    private static string SkillName(int skill)' + [Environment]::NewLine +
                       '    {' + [Environment]::NewLine +
                       '        return PublicGameData.SkillName(skill);' + [Environment]::NewLine +
                       '    }' + [Environment]::NewLine + [Environment]::NewLine
            $d = $d.Replace($readAnchor, $wrapper + $readAnchor)
          }
          Set-Content $p $d
          $verify = Get-Content $p -Raw
          if ($verify -notmatch 'return\s+PublicGameData\.SkillName\(skill\);') { throw "Public skill catalog hook failed" }

          # Bundle the same public class icon set used by A2Meter. Keep local copies
          # so the overlay never needs network access just to draw an icon.
          $iconDir = "src/Assets/ClassIcons"
          New-Item -ItemType Directory -Force -Path $iconDir | Out-Null
          $icons = @{
            "Gladiator"="검성.png"; "Templar"="수호성.png"; "Ranger"="궁성.png"; "Assassin"="살성.png";
            "Spiritmaster"="정령성.png"; "Sorcerer"="마도성.png"; "Cleric"="치유성.png"; "Chanter"="호법성.png"
          }
          foreach ($kv in $icons.GetEnumerator()) {
            $encoded = [uri]::EscapeDataString($kv.Value)
            $url = "https://cdn.jsdelivr.net/gh/a2meter/a2meter.github.io@v1.0.1/Assets/Icon/Job/$encoded"
            Invoke-WebRequest -Uri $url -OutFile (Join-Path $iconDir ($kv.Key + ".png"))
          }
          $proj = "src/Aion2DPSPro.csproj"
          $cs = Get-Content $proj -Raw
          if ($cs -notmatch 'Assets\\ClassIcons') {
            $cs = $cs.Replace('</Project>', '  <ItemGroup><Resource Include="Assets\ClassIcons\*.png" /></ItemGroup>' + [Environment]::NewLine + '</Project>')
            Set-Content $proj $cs
          }

      - name: Add complete English skill localization database
        if: env.SOURCE_FROM_ARCHIVE == 'true'
        shell: pwsh
        run: |
          $p = "src/Protocol/PublicGameData.cs"
          $d = Get-Content $p -Raw
          $anchor = '    public static string SkillName(int raw)'
          if (-not $d.Contains($anchor)) { throw "PublicGameData SkillName anchor missing" }

          # The public multilingual table contains exact KR/TW/EN names for the
          # AION 2 skill strings. Generate a local C# dictionary at build time so
          # the finished meter does not need network access for English labels.
          $url = "https://raw.githubusercontent.com/taengu/AION2-DPS-Meter/main/skills_deduped.txt"
          $txt = (Invoke-WebRequest -Uri $url -UseBasicParsing).Content
          $pairs = [ordered]@{}
          foreach ($line in ($txt -split "\r?\n")) {
            if ($line -match '\| KR=(.*?) \| TW=.*? \| EN=(.*)$') {
              $kr = $Matches[1].Trim()
              $en = $Matches[2].Trim()
              if ($kr -and $en -and -not $pairs.Contains($kr)) { $pairs[$kr] = $en }
            }
          }
          if ($pairs.Count -lt 100) { throw "English skill database download/parse produced too few entries: $($pairs.Count)" }

          $lines = New-Object System.Collections.Generic.List[string]
          $lines.Add('    private static readonly Dictionary<string,string> EnglishNames = new(StringComparer.Ordinal)')
          $lines.Add('    {')
          foreach ($kv in $pairs.GetEnumerator()) {
            $kr = $kv.Key.Replace('\\','\\\\').Replace('"','\\"')
            $en = $kv.Value.Replace('\\','\\\\').Replace('"','\\"')
            $lines.Add('        ["' + $kr + '"] = "' + $en + '",')
          }
          $lines.Add('    };')
          $lines.Add('')
          $lines.Add('    private static string LocalizeEnglish(string name)')
          $lines.Add('    {')
          $lines.Add('        if (string.IsNullOrWhiteSpace(name)) return name;')
          $lines.Add('        if (EnglishNames.TryGetValue(name, out var english)) return english;')
          $lines.Add('        return name;')
          $lines.Add('    }')
          $lines.Add('')
          $english = $lines -join [Environment]::NewLine

          $d = $d.Replace($anchor, $english + $anchor)
          $d = $d.Replace('return exact;', 'return LocalizeEnglish(exact);')
          $d = $d.Replace('return n10;', 'return LocalizeEnglish(n10);')
          $d = $d.Replace('return n10k;', 'return LocalizeEnglish(n10k);')
          $d = $d.Replace('return n100k;', 'return LocalizeEnglish(n100k);')
          Set-Content $p $d

          $v = Get-Content $p -Raw
          if ($v -notmatch 'LocalizeEnglish\(exact\)' -or $v -notmatch 'Punishment - Max') {
            throw "Complete English skill localization patch failed"
          }

      - name: Wire public skill names into decoded combat events
        if: env.SOURCE_FROM_ARCHIVE == 'true'
        shell: pwsh
        run: |
          $p = "src/Protocol/PacketDispatcher.cs"
          $d = Get-Content $p -Raw

          # The catalog helper alone is not enough: the damage/DOT return sites in
          # the extracted v5 source still format "Skill {skill}" directly.
          # Patch only those event-label expressions; never replace inside the
          # SkillName helper itself (an earlier global replacement caused recursion).
          $before = $d
          $d = $d.Replace('$"Skill {skill}"', 'SkillName(checked((int)skill))')
          Set-Content $p $d

          $verify = Get-Content $p -Raw
          if ($verify -notmatch 'SkillName\(checked\(\(int\)skill\)\)') {
            throw "No combat skill label sites were wired to PublicGameData"
          }
          if ($verify -match '\$"Skill \{skill\}"') {
            throw "Raw combat skill label remains after catalog wiring"
          }

      - name: Show bundled class icons in overlay
        if: env.SOURCE_FROM_ARCHIVE == 'true'
        shell: pwsh
        run: |
          $converter = @(
            'using System.Globalization;',
            'using System.Windows.Data;',
            '',
            'namespace Aion2DPSPro.Overlay;',
            'public sealed class ClassIconConverter : IValueConverter',
            '{',
            '    public object? Convert(object value, Type targetType, object parameter, CultureInfo culture)',
            '    {',
            '        var c = value?.ToString();',
            '        if (string.IsNullOrWhiteSpace(c) || c == "Unknown") return null;',
            '        return new Uri($"pack://application:,,,/Assets/ClassIcons/{c}.png", UriKind.Absolute);',
            '    }',
            '    public object ConvertBack(object value, Type targetType, object parameter, CultureInfo culture) => throw new NotSupportedException();',
            '}'
          ) -join [Environment]::NewLine
          Set-Content "src/Overlay/ClassIconConverter.cs" $converter

          $patched = $false
          $files = Get-ChildItem "src/Overlay" -Filter "*.xaml" -File -ErrorAction SilentlyContinue
          foreach ($file in $files) {
            $x = Get-Content $file.FullName -Raw
            if ($x -notmatch '\{Binding (Class|ClassName)\}') { continue }

            if ($x -notmatch 'xmlns:icons=') {
              $x = [regex]::Replace($x, '(xmlns:x="http://schemas\.microsoft\.com/winfx/2006/xaml")', '$1' + [Environment]::NewLine + '        xmlns:icons="clr-namespace:Aion2DPSPro.Overlay"', 1)
            }
            if ($x -notmatch 'ClassIconConverter x:Key="ClassIconConverter"') {
              # OverlayWindow already has Window.Resources. Add the converter to
              # that existing resource dictionary instead of creating a second one.
              if ($x -match '<Window.Resources>') {
                $x = $x.Replace('<Window.Resources>', '<Window.Resources>' + [Environment]::NewLine + '    <icons:ClassIconConverter x:Key="ClassIconConverter"/>')
              }
              else {
                $windowOpen = [regex]::Match($x, '<Window[\s\S]*?>').Value
                if (-not $windowOpen) { throw "Overlay Window opening tag not found" }
                $res = $windowOpen + [Environment]::NewLine + '  <Window.Resources><icons:ClassIconConverter x:Key="ClassIconConverter"/></Window.Resources>'
                $x = $x.Replace($windowOpen, $res)
              }
            }

            $pattern = '<TextBlock([^>]*?)Text="\{Binding (Class|ClassName)\}"([^>]*)/>'
            $m = [regex]::Match($x, $pattern)
            if ($m.Success) {
              $binding = $m.Groups[2].Value
              $replacement = '<StackPanel Orientation="Horizontal"><Image Width="14" Height="14" Margin="0,0,4,0" Source="{Binding ' + $binding + ', Converter={StaticResource ClassIconConverter}}"/><TextBlock Text="{Binding ' + $binding + '}"/></StackPanel>'
              $x = $x.Remove($m.Index, $m.Length).Insert($m.Index, $replacement)
              Set-Content $file.FullName $x
              $patched = $true
              break
            }
          }
          if (-not $patched) {
            Write-Host "Class binding is code-rendered rather than XAML; icons are bundled for the next renderer patch."
          }

      - name: Preserve validated class per combat actor
        if: env.SOURCE_FROM_ARCHIVE == 'true'
        shell: pwsh
        run: |
          $p = "src/MainWindow.xaml.cs"
          $s = Get-Content $p -Raw
          if ($s -notmatch 'liveEntityClasses') {
            $field = 'readonly Dictionary<long, string> liveEntityNames = new();'
            if (-not $s.Contains($field)) { throw "Live entity name cache anchor missing" }
            $s = $s.Replace($field, $field + [Environment]::NewLine +
              '              readonly Dictionary<long, string> liveEntityClasses = new();')
          }
          if ($s -notmatch 'validatedSourceClass') {
            $apply = 'engine.Apply(e);'
            if (-not $s.Contains($apply)) { throw "Combat engine apply anchor missing" }
            $block = @(
              '                      if ((e.Kind == CombatKind.Damage || e.Kind == CombatKind.Heal) && e.SourceId > 0)',
              '                      {',
              '                          if (!string.IsNullOrWhiteSpace(e.SourceClass) && e.SourceClass != "Unknown")',
              '                              liveEntityClasses[e.SourceId] = e.SourceClass;',
              '                          else if (liveEntityClasses.TryGetValue(e.SourceId, out var validatedSourceClass))',
              '                              e = e with { SourceClass = validatedSourceClass };',
              '                      }',
              '                      engine.Apply(e);'
            ) -join [Environment]::NewLine
            $s = $s.Replace($apply, $block)
          }
          Set-Content $p $s
          $v = Get-Content $p -Raw
          if ($v -notmatch 'liveEntityClasses' -or $v -notmatch 'validatedSourceClass') {
            throw "Validated class cache patch failed"
          }

      - name: Commit migrated source tree
        if: env.SOURCE_FROM_ARCHIVE == 'true'
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          if (git diff --cached --quiet) {
            Write-Host "No generated source changes to commit."
          }
          else {
            git commit -m "Commit generated Aion2DPSPro source tree"
            git push
          }

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Combat and protocol regression checks
        run: dotnet run --project tests/Regression.csproj -c Release
      - name: Restore
        run: dotnet restore src/Aion2DPSPro.csproj
      - name: WPF overlay smoke checks
        run: dotnet run --project tests/OverlaySmoke/OverlaySmoke.csproj -c Release
      - name: Upload report preview
        uses: actions/upload-artifact@v4
        with:
          name: combat-report-preview
          path: report-preview.png
          if-no-files-found: error
      - name: Publish Windows x64
        run: dotnet publish src/Aion2DPSPro.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: Aion2DPSPro-win-x64
          path: publish/
          if-no-files-found: error


      - name: Upload overlay previews
        uses: actions/upload-artifact@v4
        with:
          name: overlay-style-previews
          path: overlay-*.png
          if-no-files-found: error
