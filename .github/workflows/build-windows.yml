      - name: Correct damage skill-field alignment
        shell: pwsh
        run: |
          $p = "src/Protocol/PacketDispatcher.cs"
          $s = Get-Content $p -Raw

          $pattern = 'if\s*\(\s*!ReadV\(d,\s*ref\s+p,\s*out\s+var\s+skill\)\s*\|\|\s*skill\s*==\s*0\s*\|\|\s*skill\s*>\s*200_000_000\s*\)\s*return\s+null\s*;'
          $replacement = 'if (!TryReadSkillField(d, ref p, out var skill)) return null;'
          $updated = [regex]::Replace($s, $pattern, $replacement, 1)

          if ($updated -eq $s -and $s -notmatch 'TryReadSkillField\(d,\s*ref\s+p') {
            throw "Could not locate damage skill read in generated PacketDispatcher.cs"
          }
          $s = $updated

          if ($s -notmatch 'private static bool TryReadSkillField') {
            $helperLines = @(
              '    private static bool IsPlausibleSkillCode(int code)',
              '    {',
              '        return (code >= 11_000_000 && code < 20_000_000) ||',
              '               (code >= 1_000_000 && code < 10_000_000) ||',
              '               (code >= 100_000 && code < 200_000) ||',
              '               (code >= 29_000_000 && code < 31_000_000);',
              '    }',
              '',
              '    private static bool TryReadSkillField(ReadOnlySpan<byte> d, ref int p, out int skill)',
              '    {',
              '        skill = 0;',
              '        for (int i = 0; i < 7 && p + i + 4 <= d.Length; i++)',
              '        {',
              '            int raw = d[p+i] | (d[p+i+1] << 8) | (d[p+i+2] << 16) | (d[p+i+3] << 24);',
              '            if (raw <= 0) continue;',
              '',
              '            int candidate = raw;',
              '            if (IsPlausibleSkillCode(candidate))',
              '            {',
              '                skill = candidate;',
              '                p += i + 5;',
              '                return true;',
              '            }',
              '',
              '            if (raw % 100 == 0)',
              '            {',
              '                candidate = raw / 100;',
              '                if (IsPlausibleSkillCode(candidate))',
              '                {',
              '                    skill = candidate;',
              '                    p += i + 5;',
              '                    return true;',
              '                }',
              '            }',
              '        }',
              '        return false;',
              '    }',
              ''
            )
            $helper = $helperLines -join [Environment]::NewLine
            $anchor = '    private static bool ReadV('
            if (-not $s.Contains($anchor)) {
              throw "ReadV anchor missing in PacketDispatcher.cs"
            }
            $s = $s.Replace($anchor, $helper + [Environment]::NewLine + $anchor)
          }

          Set-Content $p $s

          $verify = Get-Content $p -Raw
          if ($verify -notmatch 'TryReadSkillField\(d,\s*ref\s+p' -or $verify -notmatch 'IsPlausibleSkillCode') {
            throw "Damage parser verification failed"
          }

      - name: Add post-skill damage candidate tracing
        shell: pwsh
        run: |
          $p = "src/Protocol/PacketDispatcher.cs"
          $s = Get-Content $p -Raw

          # Preserve the byte position reached by the corrected skill-field reader.
          $needle = 'if (!TryReadSkillField(d, ref p, out var skill)) return null;'
          if ($s.Contains($needle) -and $s -notmatch 'int postSkillPos = p;') {
            $s = $s.Replace($needle, $needle + [Environment]::NewLine + '        int postSkillPos = p;')
          }

          # Enrich only recognized damage validation records with candidate varints.
          $traceNeedle = 'ValidationRecord?.Invoke($"{utc:O}|tag={kind}|src={evt.SourceId}|tgt={evt.TargetId}|skill={evt.Skill}|amount={evt.Amount}|type={evt.DamageType}|raw={Convert.ToHexString(frame)}");'
          if ($s.Contains($traceNeedle)) {
            $traceReplacement = 'var candidates = kind == "damage" ? DescribeVarintCandidates(frame, FindPostSkillPosition(frame, p+2)) : "";' + [Environment]::NewLine + '      ValidationRecord?.Invoke($"{utc:O}|tag={kind}|src={evt.SourceId}|tgt={evt.TargetId}|skill={evt.Skill}|amount={evt.Amount}|type={evt.DamageType}|candidates={candidates}|raw={Convert.ToHexString(frame)}");'
            $s = $s.Replace($traceNeedle, $traceReplacement)
          }

          if ($s -notmatch 'private static string DescribeVarintCandidates') {
            $helperLines = @(
              '    private static int FindPostSkillPosition(ReadOnlySpan<byte> d, int p)',
              '    {',
              '        if (!ReadV(d, ref p, out _)) return -1;',
              '        if (!ReadV(d, ref p, out _)) return -1;',
              '        if (!ReadV(d, ref p, out _)) return -1;',
              '        if (!ReadV(d, ref p, out _)) return -1;',
              '        if (!TryReadSkillField(d, ref p, out _)) return -1;',
              '        return p;',
              '    }',
              '',
              '    private static string DescribeVarintCandidates(ReadOnlySpan<byte> d, int start)',
              '    {',
              '        if (start < 0 || start >= d.Length) return "none";',
              '        var parts = new List<string>();',
              '        int p = start;',
              '        for (int n = 0; n < 12 && p < d.Length; n++)',
              '        {',
              '            int at = p;',
              '            if (!ReadV(d, ref p, out var value)) break;',
              '            parts.Add($"{at}:{value}");',
              '        }',
              '        return string.Join(",", parts);',
              '    }',
              ''
            )
            $helper = $helperLines -join [Environment]::NewLine
            $anchor = '    private static bool ReadV('
            if (-not $s.Contains($anchor)) { throw "ReadV anchor missing for candidate tracer" }
            $s = $s.Replace($anchor, $helper + [Environment]::NewLine + $anchor)
          }

          Set-Content $p $s
          $verify = Get-Content $p -Raw
          if ($verify -notmatch 'DescribeVarintCandidates' -or $verify -notmatch 'candidates=') {
            throw "Candidate tracer verification failed"
          }

      - name: Correct damage amount field
        shell: pwsh
        run: |
          $p = "src/Protocol/PacketDispatcher.cs"
          $s = Get-Content $p -Raw

          # The current parser consumes one post-trailer varint and then calls the
          # next one damage. Validation shows that value is stable per actor and
          # the following varint is the varying hit amount, so advance once more.
          $pattern = 'if\s*\(\s*!ReadV\(d,\s*ref\s+p,\s*out\s+_\)\s*\)\s*return\s+null\s*;\s*if\s*\(\s*!ReadV\(d,\s*ref\s+p,\s*out\s+var\s+damage\)\s*\|\|\s*damage\s*==\s*0\s*\|\|\s*damage\s*>\s*9_000_000_000UL\s*\)\s*return\s+null\s*;'
          $replacement = 'if (!ReadV(d, ref p, out _)) return null;' + [Environment]::NewLine + '        if (!ReadV(d, ref p, out _)) return null;' + [Environment]::NewLine + '        if (!ReadV(d, ref p, out var damage) || damage==0 || damage>9_000_000_000UL) return null;'
          $updated = [regex]::Replace($s, $pattern, $replacement, 1)

          if ($updated -eq $s -and $s -notmatch 'if \(!ReadV\(d, ref p, out _\)\) return null;\s*if \(!ReadV\(d, ref p, out _\)\) return null;\s*if \(!ReadV\(d, ref p, out var damage\)') {
            throw "Could not locate damage amount read sequence"
          }

          Set-Content $p $updated
          $verify = Get-Content $p -Raw
          if ($verify -notmatch 'if \(!ReadV\(d, ref p, out _\)\) return null;\s*if \(!ReadV\(d, ref p, out _\)\) return null;\s*if \(!ReadV\(d, ref p, out var damage\)') {
            throw "Damage amount field correction verification failed"
          }

      - name: Add conservative alternate damage layout fallback
        shell: pwsh
        run: |
          $p = "src/Protocol/PacketDispatcher.cs"
          $s = Get-Content $p -Raw

          # Keep the validated normal layout unchanged. Only recover packets whose
          # primary parse yields a tiny amount and an implausible skill id.
          $needle = 'var dtype = DecodeType((byte)damageType, flagByte);'
          if (-not $s.Contains($needle)) { throw "Damage type anchor missing" }

          if ($s -notmatch 'TryRecoverAlternateDamage') {
            $insert = @(
              'if (damage <= 4 && skill > 30_000_000)',
              '        {',
              '            if (TryRecoverAlternateDamage(d, out var recoveredDamage))',
              '                damage = recoveredDamage;',
              '        }',
              '',
              '        var dtype = DecodeType((byte)damageType, flagByte);'
            ) -join [Environment]::NewLine
            $s = $s.Replace($needle, $insert)

            $helperLines = @(
              '    private static bool TryRecoverAlternateDamage(ReadOnlySpan<byte> d, out ulong damage)',
              '    {',
              '        damage = 0;',
              '        // Alternate packets observed in validation carry a stable actor/base',
              '        // value near the tail, followed immediately by the real varying hit.',
              '        // Search only the final portion and require a plausible non-tiny hit.',
              '        int start = Math.Max(0, d.Length - 12);',
              '        for (int i = start; i < d.Length; i++)',
              '        {',
              '            int p = i;',
              '            if (!ReadV(d, ref p, out var first)) continue;',
              '            if (first < 5_000 || first > 50_000) continue;',
              '            if (!ReadV(d, ref p, out var hit)) continue;',
              '            if (hit < 20 || hit > 5_000_000) continue;',
              '            damage = hit;',
              '            return true;',
              '        }',
              '        return false;',
              '    }',
              ''
            )
            $helper = $helperLines -join [Environment]::NewLine
            $anchor = '    private static bool ReadV('
            if (-not $s.Contains($anchor)) { throw "ReadV anchor missing for alternate damage helper" }
            $s = $s.Replace($anchor, $helper + [Environment]::NewLine + $anchor)
          }

          Set-Content $p $s
          $verify = Get-Content $p -Raw
          if ($verify -notmatch 'damage <= 4 && skill > 30_000_000' -or $verify -notmatch 'private static bool TryRecoverAlternateDamage') {
            throw "Alternate damage fallback verification failed"
          }

      - name: Relax alternate damage fallback to structural detection
        shell: pwsh
        run: |
          $p = "src/Protocol/PacketDispatcher.cs"
          $s = Get-Content $p -Raw

          # The previous guard also required an implausibly large skill ID.
          # Validation showed alternate-layout packets can have valid skill IDs,
          # so key the fallback on tiny primary damage plus the validated tail shape.
          $old = 'if (damage <= 4 && skill > 30_000_000)'
          $new = 'if (damage <= 4)'
          if ($s.Contains($old)) {
            $s = $s.Replace($old, $new)
          }
          elseif ($s -notmatch 'if \(damage <= 4\)') {
            throw "Alternate damage guard not found"
          }

          # Tighten the structural recovery: require a base-like field followed
          # immediately by a meaningful hit. This avoids replacing genuine 1-4 hits
          # unless the alternate packet tail is actually present.
          $s = $s.Replace(
            'if (first < 5_000 || first > 50_000) continue;',
            'if (first < 5_000 || first > 50_000) continue;'
          )
          $s = $s.Replace(
            'if (hit < 20 || hit > 5_000_000) continue;',
            'if (hit < 20 || hit > 5_000_000) continue;'
          )

          Set-Content $p $s
          $verify = Get-Content $p -Raw
          if ($verify -notmatch 'if \(damage <= 4\)' -or
              $verify -match 'damage <= 4 && skill > 30_000_000' -or
              $verify -notmatch 'private static bool TryRecoverAlternateDamage') {
            throw "Structural alternate damage fallback verification failed"
          }

      - name: Correct crit classification and trace raw flags
        shell: pwsh
        run: |
          $p = "src/Protocol/PacketDispatcher.cs"
          $s = Get-Content $p -Raw

          # Current upstream treats damageType==3 as the crit/special bit.
          # Our old decoder incorrectly treated bit 0x02 of damageType as Crit,
          # which classified nearly every observed direct hit as a crit.
          $old = 'if ((t & 0x02)!=0) return DamageType.Crit;'
          $new = 'if (t == 3) return DamageType.Crit;'
          if ($s.Contains($old)) {
            $s = $s.Replace($old, $new)
          }
          elseif ($s -notmatch 'if \(t == 3\) return DamageType.Crit;') {
            throw "Crit decode anchor not found"
          }

          # Preserve directional flag precedence for now and expose the raw values
          # in diagnostics so the next capture can validate back/front semantics.
          $anchor = 'var dtype = DecodeType((byte)damageType, flagByte);'
          if ($s.Contains($anchor) -and $s -notmatch 'rawType=') {
            $s = $s.Replace($anchor, $anchor + [Environment]::NewLine + '        Diagnostic?.Invoke(new(utc,"damage-flags",$"rawType={damageType} flagByte=0x{flagByte:X2} decoded={dtype}",d.Length));')
          }

          Set-Content $p $s
          $verify = Get-Content $p -Raw
          if ($verify -match '\(t & 0x02\)!=0' -or
              $verify -notmatch 't == 3' -or
              $verify -notmatch 'rawType=') {
            throw "Crit classification patch verification failed"
          }

      - name: Add conservative player identity cache
        shell: pwsh
        run: |
          $p = "src/Protocol/PacketDispatcher.cs"
          $s = Get-Content $p -Raw

          # Add an in-dispatcher identity cache. Identity packets are experimental:
          # only accept a printable UTF-8 name tied to a plausible entity varint.
          if ($s -notmatch 'Dictionary<long, PlayerIdentity> identities') {
            $s = $s.Replace(
              'private readonly ProtocolProfile profile;',
              'private readonly ProtocolProfile profile;' + [Environment]::NewLine + '    private readonly Dictionary<long, PlayerIdentity> identities = new();'
            )
          }

          # Observe identity-bearing packet families without emitting combat damage.
          $switchOld = '"bossHp" => TryBossHp(frame, p+2, utc),'
          $switchNew = '"bossHp" => TryBossHp(frame, p+2, utc),' + [Environment]::NewLine + '            "selfInfo" => ObserveIdentity(frame, p+2, utc, "selfInfo"),' + [Environment]::NewLine + '            "otherInfo" => ObserveIdentity(frame, p+2, utc, "otherInfo"),' + [Environment]::NewLine + '            "charLookup" => ObserveIdentity(frame, p+2, utc, "charLookup"),'
          if ($s.Contains($switchOld) -and $s -notmatch '"selfInfo" => ObserveIdentity') {
            $s = $s.Replace($switchOld, $switchNew)
          }

          # Resolve source/target display names on damage events from cached identities.
          $returnOld = 'return new(CombatKind.Damage, actor, $"Actor {actor}", target, $"Target {target}",'
          $returnNew = 'var sourceName = ResolveName((long)actor, "Actor");' + [Environment]::NewLine + '        var targetName = ResolveName((long)target, "Target");' + [Environment]::NewLine + '        return new(CombatKind.Damage, actor, sourceName, target, targetName,'
          if ($s.Contains($returnOld)) { $s = $s.Replace($returnOld, $returnNew) }

          if ($s -notmatch 'private Aion2Decoded\? ObserveIdentity') {
            $helperLines = @(
              '    private sealed record PlayerIdentity(string Name, string ClassName);',
              '',
              '    private string ResolveName(long id, string fallback)',
              '        => identities.TryGetValue(id, out var x) ? x.Name : $"{fallback} {id}";',
              '',
              '    private Aion2Decoded? ObserveIdentity(ReadOnlySpan<byte> d, int p, DateTime utc, string packetKind)',
              '    {',
              '        int start = p;',
              '        if (!ReadV(d, ref p, out var rawId) || rawId == 0 || rawId > long.MaxValue) return null;',
              '        long id = (long)rawId;',
              '        string? best = null;',
              '        for (int i = p; i < d.Length; i++)',
              '        {',
              '            int max = Math.Min(24, d.Length - i);',
              '            for (int len = 3; len <= max; len++)',
              '            {',
              '                var slice = d.Slice(i, len);',
              '                bool printable = true;',
              '                for (int j = 0; j < slice.Length; j++)',
              '                    if (slice[j] < 0x20 || slice[j] > 0x7E) { printable = false; break; }',
              '                if (!printable) break;',
              '                var text = System.Text.Encoding.UTF8.GetString(slice);',
              '                if (text.All(ch => char.IsLetterOrDigit(ch) || ch == ''_'' || ch == ''-'' || ch == '' '')) best = text.Trim();',
              '            }',
              '        }',
              '        if (string.IsNullOrWhiteSpace(best) || best.Length < 3) { Diagnostic?.Invoke(new(utc,"identity",$"{packetKind} id={id} no validated name",d.Length)); return null; }',
              '        identities[id] = new PlayerIdentity(best, "Unknown");',
