              '                int q = i;',
              '                if (ReadV(d, ref q, out var vv) && vv == u)',
              '                    hits.Add($"{id}:varint@{i}");',
              '                if (i + 2 <= d.Length && (ulong)(d[i] | (d[i+1] << 8)) == u)',
              '                    hits.Add($"{id}:le16@{i}");',
              '                if (i + 3 <= d.Length && (ulong)(d[i] | (d[i+1] << 8) | (d[i+2] << 16)) == u)',
              '                    hits.Add($"{id}:le24@{i}");',
              '                if (i + 4 <= d.Length)',
              '                {',
              '                    uint le32 = (uint)(d[i] | (d[i+1] << 8) | (d[i+2] << 16) | (d[i+3] << 24));',
              '                    if (le32 == u) hits.Add($"{id}:le32@{i}");',
              '                }',
              '                if (hits.Count >= 48) return string.Join(",", hits.Distinct());',
              '            }',
              '        }',
              '        return string.Join(",", hits.Distinct());',
              '    }',
              ''
            )
            $helper = $helperLines -join [Environment]::NewLine
            $anchor = '    private static bool ReadV('
            if (-not $s.Contains($anchor)) { throw "ReadV anchor missing for combat-ID bridge helper" }
            $s = $s.Replace($anchor, $helper + [Environment]::NewLine + $anchor)
          }

          # Record both source and target IDs as soon as validated damage/DoT is parsed.
          $damageAnchor = 'var dtype = DecodeType((byte)damageType, flagByte);'
          if ($s.Contains($damageAnchor) -and $s -notmatch 'RememberCombatEntity\(actor\);\s*RememberCombatEntity\(target\);') {
            $s = $s.Replace($damageAnchor, 'RememberCombatEntity(actor);' + [Environment]::NewLine +
              '        RememberCombatEntity(target);' + [Environment]::NewLine + '        ' + $damageAnchor)
          }

          $dotAnchor = 'uint skill=raw/100; if (skill==0) return null;'
          if ($s.Contains($dotAnchor) -and $s -notmatch 'RememberCombatEntity\(actor\);\s*RememberCombatEntity\(target\);\s*uint skill=raw/100') {
            $s = $s.Replace($dotAnchor, 'RememberCombatEntity(actor); RememberCombatEntity(target);' + [Environment]::NewLine +
              '        ' + $dotAnchor)
          }

          # Append exact combat-ID representation matches to identity records.
          $identityNeedle = '|bridgeStrings={DescribeBridgeStrings(d,start)}|raw='
          $identityReplace = '|bridgeStrings={DescribeBridgeStrings(d,start)}|combatIdHits={FindCombatIdEncodings(d)}|raw='
          if ($s.Contains($identityNeedle)) { $s = $s.Replace($identityNeedle, $identityReplace) }

          # Append the same match scan to lifecycle bridge packets.
          $bridgeNeedle = '|strings={strings}|raw={Convert.ToHexString(d)}'
          $bridgeReplace = '|strings={strings}|combatIdHits={FindCombatIdEncodings(d)}|raw={Convert.ToHexString(d)}'
          if ($s.Contains($bridgeNeedle)) { $s = $s.Replace($bridgeNeedle, $bridgeReplace) }

          Set-Content $p $s
          $verify = Get-Content $p -Raw
          if ($verify -notmatch 'FindCombatIdEncodings' -or
              $verify -notmatch 'combatIdHits=' -or
              $verify -notmatch 'RememberCombatEntity') {
            throw "Combat-to-identity bridge tracer verification failed"
          }

      - name: Parse character lookup entity identity
        shell: pwsh
        run: |
          $p = "src/Protocol/PacketDispatcher.cs"
          $s = Get-Content $p -Raw

          # Character lookup is structurally different from otherInfo. Decode its
          # actual entity ID from the fixed block after the name instead of treating
          # the first payload varint as the player ID.
          $old = '"charLookup" => ObserveIdentity(frame, p+2, utc, "charLookup"),'
          $new = '"charLookup" => TryCharacterLookup(frame, p+2, utc),'
          if ($s.Contains($old)) { $s = $s.Replace($old, $new) }

          if ($s -notmatch 'TryCharacterLookup\(ReadOnlySpan<byte>') {
            $lines = @(
              '    private Aion2Decoded? TryCharacterLookup(ReadOnlySpan<byte> d, int p, DateTime utc)',
              '    {',
              '        int start = p;',
              '        // Current lookup layout: padding(2), 0x07, varint name length, UTF-8 name,',
              '        // job(1), zeros(3), marker(1), local-like flag(1), level(1), zeros(7),',
              '        // entityId LE32, serverId LE16.',
              '        if (p + 3 > d.Length) return null;',
              '        p += 2;',
              '        if (p >= d.Length || d[p] != 0x07) return null;',
              '        p++;',
              '        if (!ReadV(d, ref p, out var nameLenU)) return null;',
              '        if (nameLenU < 1 || nameLenU > 72 || nameLenU > int.MaxValue) return null;',
              '        int nameLen = (int)nameLenU;',
              '        if (p + nameLen > d.Length) return null;',
              '        string name;',
              '        try { name = System.Text.Encoding.UTF8.GetString(d.Slice(p, nameLen)); }',
              '        catch { return null; }',
              '        if (string.IsNullOrWhiteSpace(name)) return null;',
              '        p += nameLen;',
              '        if (p + 20 > d.Length) return null;',
              '        int jobCode = d[p]; p++;',
              '        p += 3;',
              '        p++;',
              '        p++;',
              '        int level = d[p]; p++;',
              '        p += 7;',
              '        long entityId = (long)((uint)d[p] | ((uint)d[p+1] << 8) | ((uint)d[p+2] << 16) | ((uint)d[p+3] << 24));',
              '        p += 4;',
              '        int serverId = d[p] | (d[p+1] << 8);',
              '        if (entityId <= 0 || entityId > int.MaxValue) return null;',
              '        identities[entityId] = new PlayerIdentity(name, "Unknown");',
              '        var combatHit = recentCombatEntityIds.Contains(entityId) ? "YES" : "NO";',
              '        Diagnostic?.Invoke(new(utc,"char-lookup",$"Mapped lookup entity {entityId} -> {name} job={jobCode} level={level} server={serverId} combatMatch={combatHit}",d.Length));',
              '        ValidationRecord?.Invoke($"{utc:O}|tag=charLookupIdentity|entity={entityId}|name={name}|job={jobCode}|level={level}|server={serverId}|combatMatch={combatHit}|raw={Convert.ToHexString(d)}");',
              '        return new(CombatKind.PlayerName, entityId, name, 0, "", "", 0, DamageType.Unknown, 0,0,"",0);',
              '    }',
              ''
            )
            $helper = $lines -join [Environment]::NewLine
            $anchor = '    private static bool ReadV('
            if (-not $s.Contains($anchor)) { throw "ReadV anchor missing for char lookup parser" }
            $s = $s.Replace($anchor, $helper + [Environment]::NewLine + $anchor)
          }

          Set-Content $p $s
          $verify = Get-Content $p -Raw
          if ($verify -notmatch '"charLookup" => TryCharacterLookup' -or
              $verify -notmatch 'tag=charLookupIdentity' -or
              $verify -notmatch 'combatMatch=') {
            throw "Character lookup identity parser verification failed"
          }

      - name: Apply validated names to combat events and decode self identity
        shell: pwsh
        run: |
          $mainPath = "src/MainWindow.xaml.cs"
          $main = Get-Content $mainPath -Raw

          # The previous UI-only rename could not affect OverlayWindow because the
          # overlay receives the original engine snapshot. Resolve the source name
          # on the CombatEvent BEFORE CombatEngine aggregates it.
          if ($main -notmatch 'e = e with \{ Source = resolvedSourceName \}') {
            $needle = 'if (e.Kind == CombatKind.PlayerName && e.SourceId > 0 && !string.IsNullOrWhiteSpace(e.Source))' + [Environment]::NewLine +
                      '                          liveEntityNames[e.SourceId] = e.Source;'
            if (-not $main.Contains($needle)) { throw "Live identity event hook missing" }
            $replacement = $needle + [Environment]::NewLine +
              '                      if ((e.Kind == CombatKind.Damage || e.Kind == CombatKind.Heal) && e.SourceId > 0 && liveEntityNames.TryGetValue(e.SourceId, out var resolvedSourceName))' + [Environment]::NewLine +
              '                          e = e with { Source = resolvedSourceName };'
            $main = $main.Replace($needle, $replacement)
          }

          # Also fix the diagnostic grid projection; it used anonymous-property
          # shorthand (p.Name), so the earlier exact replacement never touched it.
          $main = $main.Replace('Rank=i+1, p.Name, Dps=', 'Rank=i+1, Name=ApplyLiveEntityNames(p.Name), Dps=')

          Set-Content $mainPath $main

          $dispatcherPath = "src/Protocol/PacketDispatcher.cs"
          $d = Get-Content $dispatcherPath -Raw

          # selfInfo uses a different name layout from otherInfo. The first player
          # name is an early one-byte length-prefixed UTF-8/ASCII field (no 0x07
          # marker). Decode it separately and publish a normal PlayerName event.
          $oldSelf = '"selfInfo" => ObserveIdentity(frame, p+2, utc, "selfInfo"),'
          $newSelf = '"selfInfo" => ObserveSelfIdentity(frame, p+2, utc),'
          if ($d.Contains($oldSelf)) { $d = $d.Replace($oldSelf, $newSelf) }

          if ($d -notmatch 'ObserveSelfIdentity\(ReadOnlySpan<byte>') {
            $helperLines = @(
              '    private Aion2Decoded? ObserveSelfIdentity(ReadOnlySpan<byte> d, int p, DateTime utc)',
              '    {',
              '        int start = p;',
              '        if (!ReadV(d, ref p, out var idU) || idU == 0 || idU > long.MaxValue) return null;',
              '        long id = (long)idU;',
              '        string best = "";',
              '        int nameOffset = -1;',
              '        int end = Math.Min(d.Length - 1, p + 32);',
              '        for (int i = p; i < end; i++)',
              '        {',
              '            int len = d[i];',
              '            if (len < 3 || len > 24 || i + 1 + len > d.Length) continue;',
              '            bool valid = true;',
              '            for (int j = 0; j < len; j++)',
              '            {',
              '                byte b = d[i + 1 + j];',
              '                if (!((b >= (byte)''A'' && b <= (byte)''Z'') || (b >= (byte)''a'' && b <= (byte)''z'') ||',
              '                      (b >= (byte)''0'' && b <= (byte)''9'') || b == (byte)''_'' || b == (byte)''-'')) { valid = false; break; }',
              '            }',
              '            if (!valid) continue;',
              '            best = System.Text.Encoding.UTF8.GetString(d.Slice(i + 1, len));',
              '            nameOffset = i;',
              '            break;',
              '        }',
              '        if (string.IsNullOrWhiteSpace(best)) {',
              '            ValidationRecord?.Invoke($"{utc:O}|tag=selfIdentity|entity={id}|name=|status=no-name|raw={Convert.ToHexString(d)}");',
              '            return null;',
              '        }',
              '        identities[id] = new PlayerIdentity(best, "Unknown");',
              '        Diagnostic?.Invoke(new(utc,"identity-map",$"Mapped self entity {id} -> {best}",d.Length));',
              '        ValidationRecord?.Invoke($"{utc:O}|tag=selfIdentity|entity={id}|name={best}|nameOffset={nameOffset}|raw={Convert.ToHexString(d)}");',
              '        ValidationRecord?.Invoke($"{utc:O}|tag=identityMap|entity={id}|name={best}|source=selfInfo");',
              '        return new(CombatKind.PlayerName, id, best, 0, "", "", 0, DamageType.Unknown, 0,0,"",0);',
              '    }',
              ''
            )
            $helper = $helperLines -join [Environment]::NewLine
            $anchor = '    private static bool ReadV('
            if (-not $d.Contains($anchor)) { throw "ReadV anchor missing for self identity parser" }
            $d = $d.Replace($anchor, $helper + [Environment]::NewLine + $anchor)
          }

          Set-Content $dispatcherPath $d

          $verifyMain = Get-Content $mainPath -Raw
          $verifyDispatcher = Get-Content $dispatcherPath -Raw
          if ($verifyMain -notmatch 'e = e with \{ Source = resolvedSourceName \}' -or
              $verifyMain -notmatch 'Name=ApplyLiveEntityNames\(p.Name\)' -or
              $verifyDispatcher -notmatch '"selfInfo" => ObserveSelfIdentity' -or
              $verifyDispatcher -notmatch 'tag=selfIdentity') {
            throw "Validated combat-name propagation/self identity patch failed"
          }

      - name: Decode party roster identities for combat actors
        shell: pwsh
        run: |
          $p = "src/Protocol/PacketDispatcher.cs"
          $s = Get-Content $p -Raw

          if ($s -notmatch 'partyIdentities') {
            $anchor = 'private readonly Dictionary<long, PlayerIdentity> identities = new();'
            if (-not $s.Contains($anchor)) { throw "Identity dictionary anchor missing" }
            $s = $s.Replace($anchor, $anchor + [Environment]::NewLine +
              '    private readonly Dictionary<long, PlayerIdentity> partyIdentities = new();')
          }

          # Party protocol uses opcode + 0x97. Parse it before the normal tag table.
          if ($s -notmatch 'TryObservePartyIdentities\(frame') {
            $anchor = 'var kind = profile.Tags.FirstOrDefault(kv => kv.Value.A==a && kv.Value.B==b).Key;'
            if (-not $s.Contains($anchor)) { throw "Dispatcher tag lookup anchor missing" }
            $insert = @(
              '        if (b == 0x97 && (a == 0x01 || a == 0x02 || a == 0x0B))',
              '        {',
              '            foreach (var partyEvt in TryObservePartyIdentities(frame, p + 2, utc, a))',
              '                yield return partyEvt;',
              '            yield break;',
              '        }',
              '        ' + $anchor
            ) -join [Environment]::NewLine
            $s = $s.Replace($anchor, $insert)
          }

          if ($s -notmatch 'IEnumerable<Aion2Decoded> TryObservePartyIdentities') {
            $helperLines = @(
              '    private IEnumerable<Aion2Decoded> TryObservePartyIdentities(byte[] d, int start, DateTime utc, byte opcode)',
              '    {',
              '        // Current party roster layout places CharacterId 8 bytes before the',
              '        // length-prefixed nickname and ServerId immediately before the name.',
              '        // Require all three structural checks before accepting a mapping.',
              '        var emitted = new HashSet<long>();',
              '        int end = Math.Min(d.Length, start + 4096);',
              '        for (int off = Math.Max(start + 8, 8); off < end; off++)',
              '        {',
              '            int len = d[off];',
              '            if (len < 2 || len > 48 || off + 1 + len > end) continue;',
              '            int sid = d[off - 2] | (d[off - 1] << 8);',
              '            if (sid < 1001 || sid > 2021) continue;',
              '            uint cid = (uint)(d[off - 8] | (d[off - 7] << 8) | (d[off - 6] << 16) | (d[off - 5] << 24));',
              '            if (cid == 0 || cid > 500000) continue;',
              '            string name;',
              '            try { name = System.Text.Encoding.UTF8.GetString(d, off + 1, len); } catch { continue; }',
              '            if (string.IsNullOrWhiteSpace(name) || name.All(char.IsDigit)) continue;',
              '            bool valid = true;',
              '            foreach (char c in name)',
              '            {',
              '                if (!(char.IsLetterOrDigit(c) || c == ''_'' || c == ''-'')) { valid = false; break; }',
              '            }',
              '            if (!valid) continue;',
              '            long id = cid;',
              '            partyIdentities[id] = new PlayerIdentity(name, "Unknown");',
              '            identities[id] = new PlayerIdentity(name, "Unknown");',
              '            ValidationRecord?.Invoke($"{utc:O}|tag=partyIdentity|opcode=0x{opcode:X2}|entity={id}|name={name}|server={sid}|combatMatch={recentCombatEntityIds.Contains(id)}");',
              '            Diagnostic?.Invoke(new(utc,"party-identity",$"Mapped party entity {id} -> {name} server={sid}",d.Length));',
              '            if (emitted.Add(id))',
              '                yield return new(CombatKind.PlayerName, id, name, 0, "", "", 0, DamageType.Unknown, 0,0,"",0);',
              '        }',
              '    }',
              ''
            )
            $helper = $helperLines -join [Environment]::NewLine
            $anchor = '    private static bool ReadV('
            if (-not $s.Contains($anchor)) { throw "ReadV anchor missing for party identity parser" }
            $s = $s.Replace($anchor, $helper + [Environment]::NewLine + $anchor)
          }

          Set-Content $p $s
          $verify = Get-Content $p -Raw
          if ($verify -notmatch 'b == 0x97' -or
              $verify -notmatch 'tag=partyIdentity' -or
              $verify -notmatch 'partyIdentities') {
            throw "Party identity parser patch failed"
          }

      - name: Decode party job class
        shell: pwsh
        run: |
          $p = "src/Protocol/PacketDispatcher.cs"
          $s = Get-Content $p -Raw
          $old = '            long id = cid;'
          $new = @(
            '            long id = cid;',
            '            int afterName = off + 1 + len;',
            '            int jobCode = 0;',
            '            int level = 0;',
            '            string className = "Unknown";',
            '            if (afterName + 8 <= end)',
            '            {',
            '                jobCode = d[afterName] | (d[afterName+1] << 8) | (d[afterName+2] << 16) | (d[afterName+3] << 24);',
            '                level = d[afterName+4] | (d[afterName+5] << 8) | (d[afterName+6] << 16) | (d[afterName+7] << 24);',
            '                if (level >= 1 && level <= 55)',
            '                {',
            '                    className = jobCode switch { 11 => "Gladiator", 12 => "Templar", 13 => "Assassin", 14 => "Ranger", 15 => "Sorcerer", 16 => "Spiritmaster", 17 => "Cleric", 18 => "Chanter", _ => "Unknown" };',
            '                }',
            '            }'
          ) -join [Environment]::NewLine
          if (-not $s.Contains($old)) { throw "Party member id anchor missing" }
          $s = $s.Replace($old, $new.TrimEnd())
          $s = $s.Replace('partyIdentities[id] = new PlayerIdentity(name, "Unknown");', 'partyIdentities[id] = new PlayerIdentity(name, className);')
          $s = $s.Replace('identities[id] = new PlayerIdentity(name, "Unknown");', 'identities[id] = new PlayerIdentity(name, className);')
          $s = $s.Replace('|server={sid}|combatMatch=', '|server={sid}|jobCode={jobCode}|class={className}|level={level}|combatMatch=')
          $s = $s.Replace('-> {name} server={sid}', '-> {name} class={className} job={jobCode} level={level} server={sid}')
          Set-Content $p $s

          $decoded = "src/Protocol/IAion2Decoder.cs"
          $a = Get-Content $decoded -Raw
          if ($a -notmatch 'SourceClass') {
            $a = [regex]::Replace(
              $a,
              '(public\s+sealed\s+record\s+Aion2Decoded\s*\([\s\S]*?)(\)\s*;)',
              '$1, string SourceClass = "Unknown"$2',
              1
            )
          }
          Set-Content $decoded $a

          $cap = "src/Capture/LiveCaptureAdapter.cs"
          $c = Get-Content $cap -Raw
          $oldEvent = 'd.CurrentHp, d.MaxHp, d.Effect, d.Stacks));'
          $newEvent = 'd.CurrentHp, d.MaxHp, d.Effect, d.Stacks, d.SourceClass));'
          if ($c.Contains($oldEvent)) { $c = $c.Replace($oldEvent, $newEvent) }
          Set-Content $cap $c

          $verify = Get-Content $p -Raw
          $verifyCap = Get-Content $cap -Raw
          $verifyDecoded = Get-Content $decoded -Raw
          if ($verify -notmatch 'jobCode=\{jobCode\}' -or $verify -notmatch 'new PlayerIdentity\(name, className\)' -or $verifyCap -notmatch 'd.SourceClass' -or $verifyDecoded -notmatch 'SourceClass') { throw "Party class decode patch failed" }

      - name: Infer class from validated AION 2 skill family
        shell: pwsh
        run: |
          $p = "src/Protocol/PacketDispatcher.cs"
          $s = Get-Content $p -Raw
          if ($s -notmatch 'ClassFromSkill') {
            $helper = @(
              '    private static string ClassFromSkill(int skill)',
              '    {',
              '        int family = Math.Abs(skill) / 1000000;',
              '        return family switch { 11 => "Gladiator", 12 => "Templar", 13 => "Assassin", 14 => "Ranger", 15 => "Sorcerer", 16 => "Spiritmaster", 17 => "Cleric", 18 => "Chanter", _ => "Unknown" };',
              '    }',
              ''
            ) -join [Environment]::NewLine
            $readAnchor = '    private static bool ReadV('
            if (-not $s.Contains($readAnchor)) { throw "ReadV anchor missing for skill class inference" }
            $s = $s.Replace($readAnchor, $helper + [Environment]::NewLine + $readAnchor)
          }
          $s = [regex]::Replace($s, '(return new\(CombatKind\.Damage,[\s\S]*?0,0,"",0)(\);)', '$1, ClassFromSkill(skill)$2', 1)
          $s = [regex]::Replace($s, '(return new\(damage>0\?CombatKind\.Damage:CombatKind\.Heal,[\s\S]*?DamageType\.Dot,0,0,"",0)(\);)', '$1, ClassFromSkill((int)skill)$2', 1)
          Set-Content $p $s
          $v = Get-Content $p -Raw
          if ($v -notmatch 'ClassFromSkill\(skill\)' -or $v -notmatch '14 => "Ranger"' -or $v -notmatch '16 => "Spiritmaster"') { throw "Skill-family class inference patch failed" }

      - name: Scan embedded UserInfo identity tags
        shell: pwsh
        run: |
          $p = "src/Protocol/PacketDispatcher.cs"
          $s = Get-Content $p -Raw

          # Current upstream parsers scan every decoded frame for UserInfo tags;
          # they are not guaranteed to be the frame's primary dispatch tag.
          if ($s -notmatch 'TryEmbeddedIdentity') {
            $helper = @(
              '    private Aion2Decoded? TryEmbeddedIdentity(ReadOnlySpan<byte> d, DateTime utc)',
              '    {',
              '        for (int i = 0; i + 2 < d.Length; i++)',
              '        {',
              '            string? kind = null;',
              '            if (d[i] == 51 && d[i + 1] == 54) kind = "selfInfo";',
              '            else if (d[i] == 69 && d[i + 1] == 54) kind = "otherInfo";',
              '            if (kind is null) continue;',
              '',
              '            var evt = ObserveIdentity(d, i + 2, utc, kind);',
              '            if (evt is not null)',
              '            {',
              '                ValidationRecord?.Invoke($"{utc:O}|tag=embeddedIdentity|packet={kind}|entity={evt.SourceId}|name={evt.Source}|offset={i}|raw={Convert.ToHexString(d)}");',
              '                return evt;',
              '            }',
              '        }',
              '        return null;',
              '    }',
              ''
            ) -join [Environment]::NewLine
            $readAnchor = '    private static bool ReadV('
            if (-not $s.Contains($readAnchor)) { throw "ReadV anchor missing for embedded identity scan" }
            $s = $s.Replace($readAnchor, $helper + [Environment]::NewLine + $readAnchor)
          }

          if ($s -notmatch 'embeddedIdentity = TryEmbeddedIdentity') {
            $dispatchAnchor = '        Aion2Decoded? evt = kind switch {'
            if (-not $s.Contains($dispatchAnchor)) { throw "Dispatcher event anchor missing" }
            $scan = @(
              '        var embeddedIdentity = TryEmbeddedIdentity(frame, utc);',
              '        if (embeddedIdentity is not null)',
              '            yield return embeddedIdentity;',
              '',
              '        Aion2Decoded? evt = kind switch {'
            ) -join [Environment]::NewLine
            $s = $s.Replace($dispatchAnchor, $scan)
          }

          Set-Content $p $s
          $v = Get-Content $p -Raw
          if ($v -notmatch 'TryEmbeddedIdentity' -or $v -notmatch 'tag=embeddedIdentity') {
            throw "Embedded UserInfo identity scan patch failed"
          }

      - name: Parse global-to-session identity links
        shell: pwsh
        run: |
          $p = "src/Protocol/PacketDispatcher.cs"
          $s = Get-Content $p -Raw

          # AION 2 uses a dedicated 20 36 packet to link the short combat/session
          # actor ID to the global player ID carried by identity packets.
          if ($s -notmatch 'globalPlayerNames') {
            $fieldAnchor = 'private readonly Dictionary<long, PlayerIdentity> identities = new();'
            if (-not $s.Contains($fieldAnchor)) { throw "Identity dictionary anchor missing" }
            $fields = $fieldAnchor + [Environment]::NewLine +
              '    private readonly Dictionary<long, string> globalPlayerNames = new();' + [Environment]::NewLine +
              '    private readonly Dictionary<long, long> sessionToGlobal = new();'
            $s = $s.Replace($fieldAnchor, $fields)
          }

          # Keep every validated identity under its global/entity ID.
          $identityAnchor = 'identities[id] = new PlayerIdentity(best, "Unknown");'
          if ($s.Contains($identityAnchor) -and $s -notmatch 'globalPlayerNames\[id\] = best') {
            $s = $s.Replace($identityAnchor, $identityAnchor + [Environment]::NewLine + '        globalPlayerNames[id] = best;')
          }

          if ($s -notmatch 'TryGlobalSessionLink') {
            $helper = @(
              '    private Aion2Decoded? TryGlobalSessionLink(ReadOnlySpan<byte> d, int tagOffset, DateTime utc)',
              '    {',
              '        int p = tagOffset + 2;',
              '        if (p + 2 > d.Length) return null;',
              '        p += 2;',
              '        if (!ReadV(d, ref p, out var rawSession) || rawSession == 0 || rawSession > long.MaxValue) return null;',
              '        if (p + 8 > d.Length) return null;',
              '        p += 4;',
              '        uint global = (uint)(d[p] | (d[p+1] << 8) | (d[p+2] << 16) | (d[p+3] << 24));',
              '        if (global == 0) return null;',
              '        long session = (long)rawSession;',
              '        long globalId = global;',
              '        sessionToGlobal[session] = globalId;',
              '        ValidationRecord?.Invoke($"{utc:O}|tag=globalSessionLink|session={session}|global={globalId}|offset={tagOffset}|raw={Convert.ToHexString(d)}");',
              '        if (!globalPlayerNames.TryGetValue(globalId, out var name) || string.IsNullOrWhiteSpace(name)) return null;',
              '        identities[session] = new PlayerIdentity(name, "Unknown");',
              '        ValidationRecord?.Invoke($"{utc:O}|tag=globalSessionName|session={session}|global={globalId}|name={name}");',
              '        return new(CombatKind.PlayerName,session,name,0,"","",0,DamageType.Unknown,0,0,"",0);',
              '    }',
              '',
              '    private Aion2Decoded? TryEmbeddedGlobalSessionLink(ReadOnlySpan<byte> d, DateTime utc)',
              '    {',
              '        for (int i = 0; i + 2 < d.Length; i++)',
              '            if (d[i] == 0x20 && d[i + 1] == 0x36)',
              '                return TryGlobalSessionLink(d, i, utc);',
              '        return null;',
              '    }',
              ''
            ) -join [Environment]::NewLine
            $readAnchor = '    private static bool ReadV('
            if (-not $s.Contains($readAnchor)) { throw "ReadV anchor missing for global/session link" }
            $s = $s.Replace($readAnchor, $helper + [Environment]::NewLine + $readAnchor)
          }

          # Run the dedicated link scan on every decoded frame, like UserInfo.
          if ($s -notmatch 'embeddedLink = TryEmbeddedGlobalSessionLink') {
            $dispatchAnchor = '        var embeddedIdentity = TryEmbeddedIdentity(frame, utc);'
            if (-not $s.Contains($dispatchAnchor)) { throw "Embedded identity dispatch anchor missing" }
            $scan = @(
              '        var embeddedLink = TryEmbeddedGlobalSessionLink(frame, utc);',
              '        if (embeddedLink is not null)',
              '            yield return embeddedLink;',
              '',
              '        var embeddedIdentity = TryEmbeddedIdentity(frame, utc);'
            ) -join [Environment]::NewLine
            $s = $s.Replace($dispatchAnchor, $scan)
          }

          # If identity arrives after its link packet, promote all linked session IDs.
          $mapAnchor = 'globalPlayerNames[id] = best;'
          if ($s.Contains($mapAnchor) -and $s -notmatch 'lateGlobalSessionName') {
            $late = @(
              $mapAnchor,
              '        foreach (var link in sessionToGlobal.Where(x => x.Value == id).ToArray())',
              '        {',
              '            identities[link.Key] = new PlayerIdentity(best, "Unknown");',
              '            ValidationRecord?.Invoke($"{utc:O}|tag=lateGlobalSessionName|session={link.Key}|global={id}|name={best}");',
              '        }'
            ) -join [Environment]::NewLine
            $s = $s.Replace($mapAnchor, $late)
          }

          Set-Content $p $s
          $v = Get-Content $p -Raw
          if ($v -notmatch 'TryGlobalSessionLink' -or
              $v -notmatch 'globalSessionLink' -or
              $v -notmatch 'sessionToGlobal') {
            throw "Global/session identity link patch failed"
          }

      - name: Preserve validated class per combat actor
        shell: pwsh
        run: |
          $p = "src/MainWindow.xaml.cs"
          $s = Get-Content $p -Raw
          if ($s -notmatch 'liveEntityClasses') {
            $field = 'readonly Dictionary<long, string> liveEntityNames = new();'
            if (-not $s.Contains($field)) { throw "Live entity name cache anchor missing" }
            $s = $s.Replace($field, $field + [Environment]::NewLine +
              '              readonly Dictionary<long, string> liveEntityClasses = new();')
          }
          if ($s -notmatch 'validatedSourceClass') {
            $apply = 'engine.Apply(e);'
            if (-not $s.Contains($apply)) { throw "Combat engine apply anchor missing" }
            $block = @(
              '                      if ((e.Kind == CombatKind.Damage || e.Kind == CombatKind.Heal) && e.SourceId > 0)',
              '                      {',
              '                          if (!string.IsNullOrWhiteSpace(e.SourceClass) && e.SourceClass != "Unknown")',
              '                              liveEntityClasses[e.SourceId] = e.SourceClass;',
              '                          else if (liveEntityClasses.TryGetValue(e.SourceId, out var validatedSourceClass))',
              '                              e = e with { SourceClass = validatedSourceClass };',
              '                      }',
              '                      engine.Apply(e);'
            ) -join [Environment]::NewLine
            $s = $s.Replace($apply, $block)
          }
          Set-Content $p $s
          $v = Get-Content $p -Raw
          if ($v -notmatch 'liveEntityClasses' -or $v -notmatch 'validatedSourceClass') {
            throw "Validated class cache patch failed"
          }

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Restore
        run: dotnet restore src/Aion2DPSPro.csproj
      - name: Publish Windows x64
        run: dotnet publish src/Aion2DPSPro.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: Aion2DPSPro-win-x64
          path: publish/
          if-no-files-found: error
