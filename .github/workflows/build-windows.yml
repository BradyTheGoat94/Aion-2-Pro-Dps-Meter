name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "src/**"
      - "Aion2DPSPro-FirstLiveParser-v5.zip"
      - ".github/workflows/build-windows.yml"

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Expand source archive when needed
        shell: pwsh
        run: |
          if (-not (Test-Path "src/Aion2DPSPro.csproj")) {
            if (-not (Test-Path "Aion2DPSPro-FirstLiveParser-v5.zip")) { throw "Source project or v5 source ZIP not found." }
            Expand-Archive -Path "Aion2DPSPro-FirstLiveParser-v5.zip" -DestinationPath "." -Force
          }
      - name: Apply build fixes
        shell: pwsh
        run: |
          $ioFiles = @(
            "src/Protocol/ReplayRecorder.cs",
            "src/Protocol/ProtocolProfile.cs",
            "src/Storage/FightStore.cs"
          )
          foreach ($file in $ioFiles) {
            $text = Get-Content $file -Raw
            if ($text -notmatch 'using System.IO;') {
              Set-Content $file ("using System.IO;" + [Environment]::NewLine + $text)
            }
          }

          $iface = "src/Protocol/IAion2Decoder.cs"
          $ifaceText = Get-Content $iface -Raw
          $ifaceText = $ifaceText.Replace("Decode(ReadOnlySpan<byte> payload, DateTime utc)", "Decode(byte[] payload, DateTime utc)")
          Set-Content $iface $ifaceText

          $files = @(
            "src/Protocol/TcpStreamReassembler.cs",
            "src/Protocol/StreamFramer.cs",
            "src/Protocol/CurrentClientDecoder.cs",
            "src/Protocol/PacketDispatcher.cs"
          )
          foreach ($file in $files) {
            $text = Get-Content $file -Raw
            $text = $text.Replace("ReadOnlySpan<byte> payload", "byte[] payload")
            $text = $text.Replace("ReadOnlySpan<byte> bytes", "byte[] bytes")
            $text = $text.Replace("ReadOnlySpan<byte> frame", "byte[] frame")
            Set-Content $file $text
          }

          $dispatcher = "src/Protocol/PacketDispatcher.cs"
          $text = Get-Content $dispatcher -Raw
          $text = $text.Replace('return new(CombatKind.Damage, actor, $"Actor {actor}", target, $"Target {target}",', 'return new(CombatKind.Damage, checked((long)actor), $"Actor {actor}", checked((long)target), $"Target {target}",')
          $text = $text.Replace('return new(damage>0?CombatKind.Damage:CombatKind.Heal, actor,$"Actor {actor}",target,$"Target {target}",', 'return new(damage>0?CombatKind.Damage:CombatKind.Heal, checked((long)actor),$"Actor {actor}",checked((long)target),$"Target {target}",')
          $text = $text.Replace('return new(CombatKind.TargetHp,0,"",entity,$"Target {entity}","",0,DamageType.Unknown', 'return new(CombatKind.TargetHp,0,"",checked((long)entity),$"Target {entity}","",0,DamageType.Unknown')
          Set-Content $dispatcher $text
      - name: Disable preview data and add live diagnostics
        shell: pwsh
        run: |
          $main = @'
          using System.Windows;
          using System.Windows.Threading;
          using Aion2DPSPro.Capture;
          using Aion2DPSPro.Overlay;
          using Aion2DPSPro.Protocol;

          namespace Aion2DPSPro;

          public partial class MainWindow : Window
          {
              readonly CombatEngine engine = new();
              readonly DispatcherTimer timer = new() { Interval = TimeSpan.FromMilliseconds(250) };
              readonly OverlayWindow overlay = new();
              readonly LiveCaptureAdapter capture;
              readonly List<OverlayWindow> extraOverlays = new();
              long packets;
              long decoderDiagnostics;
              long recognized;
              long parsedEvents;
              string captureStatus = "Starting live capture...";

              public MainWindow()
              {
                  InitializeComponent();
                  engine.PreviewMode = false;
                  var profilePath = System.IO.Path.Combine(AppContext.BaseDirectory, "Protocol", "Profiles", "global-current.json");
                  ProtocolProfile profile;
                  try { profile = ProtocolProfile.Load(profilePath); }
                  catch { profile = ProtocolProfile.SafeGlobalScaffold(); }

                  var decoder = new CurrentClientDecoder(profile);
                  decoder.Diagnostic += d => Dispatcher.Invoke(() =>
                  {
                      decoderDiagnostics++;
                      if (d.Stage == "parse") recognized++;
                      LastDecoder.Text = $"[{d.Stage}] {d.Message} ({d.Bytes} bytes)";
                      RenderDiagnostics(decoder.ProfileId);
                  });

                  capture = new LiveCaptureAdapter(decoder);
                  capture.PacketCaptured += () => Dispatcher.Invoke(() => { packets++; RenderDiagnostics(decoder.ProfileId); });
                  capture.EventReceived += e => Dispatcher.Invoke(() =>
                  {
                      parsedEvents++;
                      engine.Apply(e);
                      RenderDiagnostics(decoder.ProfileId);
                  });
                  capture.StatusChanged += s => Dispatcher.Invoke(() =>
                  {
                      captureStatus = s;
                      RenderDiagnostics(decoder.ProfileId);
                  });

                  timer.Tick += (_, _) => Render();
                  timer.Start();
                  capture.Start();
                  RenderDiagnostics(decoder.ProfileId);
              }

              void RenderDiagnostics(string profileId)
              {
                  Status.Text = captureStatus;
                  PacketCount.Text = packets.ToString("N0");
                  DiagnosticCount.Text = decoderDiagnostics.ToString("N0");
                  RecognizedCount.Text = recognized.ToString("N0");
                  EventCount.Text = parsedEvents.ToString("N0");
                  Profile.Text = profileId;
              }

              void OpenOverlay(object sender, RoutedEventArgs e)
              {
                  if (!overlay.IsVisible) overlay.Show();
                  overlay.Activate();
              }

              void Reset(object sender, RoutedEventArgs e) => engine.ResetFight();

              void Render()
              {
                  var s = engine.Snapshot();
                  Dps.Text = $"{s.FightDps:0} DPS";
                  Damage.Text = $"{s.FightDamage:N0} damage";
                  Target.Text = s.Target is null ? "No target" :
                      $"{s.Target.Name}  {s.Target.Percent:0.0}%  {s.Target.CurrentHp:N0}/{s.Target.MaxHp:N0}";
                  Grid.ItemsSource = s.Players.Select((p,i) => new {
                      Rank=i+1, p.Name, Dps=p.Dps.ToString("N0"), Damage=p.Damage.ToString("N0"), Share=$"{p.Share:0.0}%"
                  }).ToList();
                  overlay.Render(s);
              }

              protected override void OnClosed(EventArgs e)
              {
                  timer.Stop();
                  capture.Dispose();
                  overlay.Close();
                  foreach (var w in extraOverlays) w.Close();
                  base.OnClosed(e);
              }
          }
          '@
          Set-Content "src/MainWindow.xaml.cs" $main

          $capturePath = "src/Capture/LiveCaptureAdapter.cs"
          $captureText = Get-Content $capturePath -Raw
          $captureText = $captureText.Replace('public event Action<string>? StatusChanged;', 'public event Action<string>? StatusChanged;' + [Environment]::NewLine + '    public event Action? PacketCaptured;')
          $captureText = $captureText.Replace('if (tcp?.PayloadData is not { Length: > 0 }) return;', 'if (tcp?.PayloadData is not { Length: > 0 }) return;' + [Environment]::NewLine + '        PacketCaptured?.Invoke();')
          Set-Content $capturePath $captureText

          $xaml = @'
          <Window x:Class="Aion2DPSPro.MainWindow"
           xmlns="http://schemas.microsoft.com/winfx/2006/xaml/presentation"
           xmlns:x="http://schemas.microsoft.com/winfx/2006/xaml"
           Title="Aion2DPSPro — LIVE DIAGNOSTIC" Width="900" Height="570" Background="#0A0E16" Foreground="#F3F6FF">
           <Grid Margin="18">
            <Grid.RowDefinitions><RowDefinition Height="Auto"/><RowDefinition Height="*"/></Grid.RowDefinitions>
            <DockPanel Margin="0,0,0,12">
             <StackPanel>
              <TextBlock Text="AION 2 DPS — LIVE DIAGNOSTIC" FontSize="24" FontWeight="Bold"/>
              <TextBlock Text="NO SIMULATED DATA — values remain zero until live packets decode" Foreground="#FF6B6B" FontWeight="SemiBold"/>
             </StackPanel>
             <StackPanel DockPanel.Dock="Right" Orientation="Horizontal">
              <Button Content="OPEN OVERLAY" Margin="6" Padding="12,6" Click="OpenOverlay"/>
              <Button Content="RESET FIGHT" Margin="6" Padding="12,6" Click="Reset"/>
             </StackPanel>
            </DockPanel>
            <Grid Grid.Row="1">
             <Grid.ColumnDefinitions><ColumnDefinition Width="3*"/><ColumnDefinition Width="2*"/></Grid.ColumnDefinitions>
             <Border Background="#121925" CornerRadius="10" Padding="14" Margin="0,0,8,0">
              <DockPanel>
               <TextBlock DockPanel.Dock="Top" Text="LIVE COMBAT ONLY" FontSize="18" FontWeight="SemiBold" Margin="0,0,0,10"/>
               <DataGrid x:Name="Grid" AutoGenerateColumns="False" IsReadOnly="True" Background="#121925" Foreground="#F3F6FF" BorderThickness="0">
                <DataGrid.Columns>
                 <DataGridTextColumn Header="#" Binding="{Binding Rank}" Width="35"/>
                 <DataGridTextColumn Header="Player" Binding="{Binding Name}" Width="*"/>
                 <DataGridTextColumn Header="DPS" Binding="{Binding Dps}" Width="85"/>
                 <DataGridTextColumn Header="Damage" Binding="{Binding Damage}" Width="100"/>
                 <DataGridTextColumn Header="Share" Binding="{Binding Share}" Width="70"/>
                </DataGrid.Columns>
               </DataGrid>
              </DockPanel>
             </Border>
             <StackPanel Grid.Column="1" Margin="8,0,0,0">
              <Border Background="#121925" CornerRadius="10" Padding="14" Margin="0,0,0,8">
               <StackPanel>
                <TextBlock Text="CURRENT FIGHT" Foreground="#9AA8C2"/>
                <TextBlock x:Name="Dps" Text="0 DPS" FontSize="34" FontWeight="Bold"/>
                <TextBlock x:Name="Damage" Text="0 damage"/>
                <TextBlock x:Name="Target" Text="No target" Margin="0,8,0,0"/>
               </StackPanel>
              </Border>
              <Border Background="#121925" CornerRadius="10" Padding="14">
               <StackPanel>
                <TextBlock Text="LIVE PIPELINE" FontSize="16" FontWeight="SemiBold"/>
                <TextBlock x:Name="Status" Text="Starting..." TextWrapping="Wrap" Margin="0,6,0,10"/>
                <Grid>
                 <Grid.ColumnDefinitions><ColumnDefinition Width="*"/><ColumnDefinition Width="Auto"/></Grid.ColumnDefinitions>
                 <Grid.RowDefinitions><RowDefinition/><RowDefinition/><RowDefinition/><RowDefinition/></Grid.RowDefinitions>
                 <TextBlock Text="TCP packets captured"/><TextBlock x:Name="PacketCount" Grid.Column="1" Text="0" FontWeight="Bold"/>
                 <TextBlock Grid.Row="1" Text="Decoder diagnostics"/><TextBlock x:Name="DiagnosticCount" Grid.Row="1" Grid.Column="1" Text="0" FontWeight="Bold"/>
                 <TextBlock Grid.Row="2" Text="Recognized parses"/><TextBlock x:Name="RecognizedCount" Grid.Row="2" Grid.Column="1" Text="0" FontWeight="Bold"/>
                 <TextBlock Grid.Row="3" Text="Combat events emitted"/><TextBlock x:Name="EventCount" Grid.Row="3" Grid.Column="1" Text="0" FontWeight="Bold"/>
                </Grid>
                <TextBlock Text="Protocol profile" Foreground="#9AA8C2" Margin="0,12,0,2"/>
                <TextBlock x:Name="Profile" Text="-" TextWrapping="Wrap"/>
                <TextBlock Text="Last decoder message" Foreground="#9AA8C2" Margin="0,12,0,2"/>
                <TextBlock x:Name="LastDecoder" Text="Waiting for traffic..." TextWrapping="Wrap"/>
               </StackPanel>
              </Border>
             </StackPanel>
            </Grid>
           </Grid>
          </Window>
          '@
          Set-Content "src/MainWindow.xaml" $xaml

      - name: Apply capture integrity diagnostics
        shell: pwsh
        run: |
          $capture = @'
          using SharpPcap;
          using PacketDotNet;
          using Aion2DPSPro.Protocol;

          namespace Aion2DPSPro.Capture;

          public sealed class LiveCaptureAdapter : IDisposable
          {
              private readonly IAion2Decoder decoder;
              private readonly List<ICaptureDevice> devices = new();
              private readonly TcpStreamReassembler reassembler = new();
              private readonly object sync = new();
              private readonly Dictionary<string, (uint Seq, int Len, int Hash)> recent = new();
              private string? lockedDevice;
              private string? lockedFlow;

              public event Action<CombatEvent>? EventReceived;
              public event Action<string>? StatusChanged;
              public event Action? PacketCaptured;
              public event Action? DuplicateSuppressed;
              public event Action<string>? FlowLocked;

              public LiveCaptureAdapter(IAion2Decoder decoder) => this.decoder = decoder;

              public void Start()
              {
                  var available = CaptureDeviceList.Instance;
                  if (available.Count == 0) { StatusChanged?.Invoke("No packet capture adapter found. Install Npcap."); return; }
                  foreach (var d in available)
                  {
                      try
                      {
                          d.OnPacketArrival += OnPacket;
                          d.Open(DeviceModes.Promiscuous, 1000);
                          d.Filter = "tcp port 13328";
                          d.StartCapture();
                          devices.Add(d);
                      }
                      catch { try { d.Close(); } catch { } }
                  }
                  StatusChanged?.Invoke($"Waiting to lock onto active AION 2 TCP/13328 flow ({devices.Count} adapters armed).");
              }

              private void OnPacket(object sender, PacketCapture capture)
              {
                  var raw = capture.GetPacket();
                  var packet = Packet.ParsePacket(raw.LinkLayerType, raw.Data);
                  var tcp = packet.Extract<TcpPacket>();
                  if (tcp?.PayloadData is not { Length: > 0 }) return;
                  var ip = packet.Extract<IPPacket>();
                  if (ip == null) return;

                  string device = (sender as ICaptureDevice)?.Name ?? "unknown";
                  string flow = $"{ip.SourceAddress}:{tcp.SourcePort}>{ip.DestinationAddress}:{tcp.DestinationPort}";
                  int hash = HashCode.Combine(tcp.PayloadData.Length,
                      tcp.PayloadData.Length > 0 ? tcp.PayloadData[0] : 0,
                      tcp.PayloadData.Length > 1 ? tcp.PayloadData[^1] : 0);

                  lock (sync)
                  {
                      if (lockedDevice == null)
                      {
                          lockedDevice = device;
                          lockedFlow = flow;
                          FlowLocked?.Invoke($"{device} | {flow}");
                          StatusChanged?.Invoke($"Locked to active AION 2 adapter/flow: {flow}");
                      }
                      if (device != lockedDevice || flow != lockedFlow) return;

                      string key = flow;
                      if (recent.TryGetValue(key, out var last) &&
                          last.Seq == tcp.SequenceNumber && last.Len == tcp.PayloadData.Length && last.Hash == hash)
                      {
                          DuplicateSuppressed?.Invoke();
                          return;
                      }
                      recent[key] = (tcp.SequenceNumber, tcp.PayloadData.Length, hash);
                  }

                  PacketCaptured?.Invoke();
                  foreach (var chunk in reassembler.Push(flow, tcp.SequenceNumber, tcp.PayloadData))
                  foreach (var d in decoder.Decode(chunk, DateTime.UtcNow))
                      EventReceived?.Invoke(new CombatEvent(DateTime.UtcNow, d.Kind, d.SourceId, d.Source,
                          d.TargetId, d.Target, d.Skill, d.Amount, d.DamageType,
                          d.CurrentHp, d.MaxHp, d.Effect, d.Stacks));
              }

              public void Dispose()
              {
                  foreach (var d in devices) { try { d.StopCapture(); } catch { } try { d.Close(); } catch { } }
                  devices.Clear();
              }
          }
          '@
          Set-Content "src/Capture/LiveCaptureAdapter.cs" $capture

          $mainPath = "src/MainWindow.xaml.cs"
          $main = Get-Content $mainPath -Raw
          $main = $main.Replace('long parsedEvents;', 'long parsedEvents;' + [Environment]::NewLine + '              long duplicates;' + [Environment]::NewLine + '              long damageEvents, healEvents, hpEvents, otherEvents;' + [Environment]::NewLine + '              string activeFlow = "Waiting...";')
          $main = $main.Replace('capture.EventReceived += e => Dispatcher.Invoke(() =>', 'capture.DuplicateSuppressed += () => Dispatcher.Invoke(() => { duplicates++; RenderDiagnostics(decoder.ProfileId); });' + [Environment]::NewLine + '                  capture.FlowLocked += s => Dispatcher.Invoke(() => { activeFlow = s; RenderDiagnostics(decoder.ProfileId); });' + [Environment]::NewLine + '                  capture.EventReceived += e => Dispatcher.Invoke(() =>')
          $main = $main.Replace('parsedEvents++;' + [Environment]::NewLine + '                      engine.Apply(e);', 'parsedEvents++;' + [Environment]::NewLine + '                      switch (e.Kind) { case CombatKind.Damage: damageEvents++; break; case CombatKind.Heal: healEvents++; break; case CombatKind.TargetHp: hpEvents++; break; default: otherEvents++; break; }' + [Environment]::NewLine + '                      engine.Apply(e);')
          $main = $main.Replace('EventCount.Text = parsedEvents.ToString("N0");', 'EventCount.Text = parsedEvents.ToString("N0");' + [Environment]::NewLine + '                  DuplicateCount.Text = duplicates.ToString("N0");' + [Environment]::NewLine + '                  DamageEventCount.Text = damageEvents.ToString("N0");' + [Environment]::NewLine + '                  HealEventCount.Text = healEvents.ToString("N0");' + [Environment]::NewLine + '                  HpEventCount.Text = hpEvents.ToString("N0");' + [Environment]::NewLine + '                  OtherEventCount.Text = otherEvents.ToString("N0");' + [Environment]::NewLine + '                  ActiveFlow.Text = activeFlow;')
          Set-Content $mainPath $main

          $xamlPath = "src/MainWindow.xaml"
          $xaml = Get-Content $xamlPath -Raw
          $old = '<TextBlock Grid.Row="3" Text="Combat events emitted"/><TextBlock x:Name="EventCount" Grid.Row="3" Grid.Column="1" Text="0" FontWeight="Bold"/>'
          $new = $old + '</Grid><Grid Margin="0,8,0,0"><Grid.ColumnDefinitions><ColumnDefinition Width="*"/><ColumnDefinition Width="Auto"/></Grid.ColumnDefinitions><Grid.RowDefinitions><RowDefinition/><RowDefinition/><RowDefinition/><RowDefinition/><RowDefinition/></Grid.RowDefinitions><TextBlock Text="Duplicates suppressed"/><TextBlock x:Name="DuplicateCount" Grid.Column="1" Text="0" FontWeight="Bold"/><TextBlock Grid.Row="1" Text="Damage events"/><TextBlock x:Name="DamageEventCount" Grid.Row="1" Grid.Column="1" Text="0" FontWeight="Bold"/><TextBlock Grid.Row="2" Text="Heal events"/><TextBlock x:Name="HealEventCount" Grid.Row="2" Grid.Column="1" Text="0" FontWeight="Bold"/><TextBlock Grid.Row="3" Text="HP events"/><TextBlock x:Name="HpEventCount" Grid.Row="3" Grid.Column="1" Text="0" FontWeight="Bold"/><TextBlock Grid.Row="4" Text="Other events"/><TextBlock x:Name="OtherEventCount" Grid.Row="4" Grid.Column="1" Text="0" FontWeight="Bold"/>'
          $xaml = $xaml.Replace($old, $new)
          $xaml = $xaml.Replace('<TextBlock Text="Protocol profile" Foreground="#9AA8C2" Margin="0,12,0,2"/>', '<TextBlock Text="Locked adapter / flow" Foreground="#9AA8C2" Margin="0,12,0,2"/><TextBlock x:Name="ActiveFlow" Text="Waiting..." TextWrapping="Wrap"/><TextBlock Text="Protocol profile" Foreground="#9AA8C2" Margin="0,12,0,2"/>')
          Set-Content $xamlPath $xaml

      - name: Fix bidirectional conversation capture and event counters
        shell: pwsh
        run: |
          $capturePath = "src/Capture/LiveCaptureAdapter.cs"
          $capture = Get-Content $capturePath -Raw
          $capture = $capture.Replace('private string? lockedFlow;', 'private string? lockedConversation;')
          $capture = $capture.Replace('string flow = $"{{ip.SourceAddress}}:{{tcp.SourcePort}}>{{ip.DestinationAddress}}:{{tcp.DestinationPort}}";', 'string flow = $"{{ip.SourceAddress}}:{{tcp.SourcePort}}>{{ip.DestinationAddress}}:{{tcp.DestinationPort}}";' + [Environment]::NewLine + '                  string ep1 = $"{{ip.SourceAddress}}:{{tcp.SourcePort}}";' + [Environment]::NewLine + '                  string ep2 = $"{{ip.DestinationAddress}}:{{tcp.DestinationPort}}";' + [Environment]::NewLine + '                  string conversation = string.CompareOrdinal(ep1, ep2) <= 0 ? $"{{ep1}}<>{{ep2}}" : $"{{ep2}}<>{{ep1}}";')
          $capture = $capture.Replace('lockedFlow = flow;', 'lockedConversation = conversation;')
          $capture = $capture.Replace('FlowLocked?.Invoke($"{{device}} | {{flow}}");', 'FlowLocked?.Invoke($"{{device}} | {{conversation}}");')
          $capture = $capture.Replace('StatusChanged?.Invoke($"Locked to active AION 2 adapter/flow: {{flow}}");', 'StatusChanged?.Invoke($"Locked to active AION 2 bidirectional conversation: {{conversation}}");')
          $capture = $capture.Replace('if (device != lockedDevice || flow != lockedFlow) return;', 'if (device != lockedDevice || conversation != lockedConversation) return;')
          Set-Content $capturePath $capture

          $mainPath = "src/MainWindow.xaml.cs"
          $main = Get-Content $mainPath -Raw
          $main = $main.Replace('switch (e.Kind) { case CombatKind.Damage: damageEvents++; break; case CombatKind.Heal: healEvents++; break; case CombatKind.TargetHp: hpEvents++; break; default: otherEvents++; break; }', 'if (e.Kind == CombatKind.Damage) damageEvents++; else if (e.Kind == CombatKind.Heal) healEvents++; else if (e.Kind == CombatKind.TargetHp) hpEvents++; else otherEvents++;')
          Set-Content $mainPath $main

      - name: Repair bidirectional capture implementation
        shell: pwsh
        run: |
          $capture = @'
          using SharpPcap;
          using PacketDotNet;
          using Aion2DPSPro.Protocol;

          namespace Aion2DPSPro.Capture;

          public sealed class LiveCaptureAdapter : IDisposable
          {
              private readonly IAion2Decoder decoder;
              private readonly List<ICaptureDevice> devices = new();
              private readonly TcpStreamReassembler reassembler = new();
              private readonly object sync = new();
              private readonly Dictionary<string, (uint Seq, int Len, int Hash)> recent = new();
              private string? lockedDevice;
              private string? lockedConversation;

              public event Action<CombatEvent>? EventReceived;
              public event Action<string>? StatusChanged;
              public event Action? PacketCaptured;
              public event Action? DuplicateSuppressed;
              public event Action<string>? FlowLocked;

              public LiveCaptureAdapter(IAion2Decoder decoder) => this.decoder = decoder;

              public void Start()
              {
                  var available = CaptureDeviceList.Instance;
                  if (available.Count == 0) { StatusChanged?.Invoke("No packet capture adapter found. Install Npcap."); return; }
                  foreach (var d in available)
                  {
                      try
                      {
                          d.OnPacketArrival += OnPacket;
                          d.Open(DeviceModes.Promiscuous, 1000);
                          d.Filter = "tcp port 13328";
                          d.StartCapture();
                          devices.Add(d);
                      }
                      catch { try { d.Close(); } catch { } }
                  }
                  StatusChanged?.Invoke($"Waiting for active AION 2 TCP/13328 conversation ({devices.Count} adapters armed).");
              }

              private void OnPacket(object sender, PacketCapture capture)
              {
                  var raw = capture.GetPacket();
                  var packet = Packet.ParsePacket(raw.LinkLayerType, raw.Data);
                  var tcp = packet.Extract<TcpPacket>();
                  if (tcp?.PayloadData is not { Length: > 0 }) return;
                  var ip = packet.Extract<IPPacket>();
                  if (ip == null) return;

                  string device = (sender as ICaptureDevice)?.Name ?? "unknown";
                  string source = $"{ip.SourceAddress}:{tcp.SourcePort}";
                  string destination = $"{ip.DestinationAddress}:{tcp.DestinationPort}";
                  string direction = $"{source}>{destination}";
                  string conversation = string.CompareOrdinal(source, destination) <= 0
                      ? $"{source}<>{destination}"
                      : $"{destination}<>{source}";

                  int hash = HashCode.Combine(tcp.PayloadData.Length,
                      tcp.PayloadData[0],
                      tcp.PayloadData.Length > 1 ? tcp.PayloadData[^1] : 0);

                  lock (sync)
                  {
                      if (lockedDevice == null)
                      {
                          lockedDevice = device;
                          lockedConversation = conversation;
                          FlowLocked?.Invoke($"{device} | {conversation}");
                          StatusChanged?.Invoke($"Locked to AION 2 bidirectional conversation: {conversation}");
                      }

                      if (device != lockedDevice || conversation != lockedConversation) return;

                      string duplicateKey = direction;
                      if (recent.TryGetValue(duplicateKey, out var last) &&
                          last.Seq == tcp.SequenceNumber &&
                          last.Len == tcp.PayloadData.Length &&
                          last.Hash == hash)
                      {
                          DuplicateSuppressed?.Invoke();
                          return;
                      }
                      recent[duplicateKey] = (tcp.SequenceNumber, tcp.PayloadData.Length, hash);
                  }

                  PacketCaptured?.Invoke();

                  // Direction stays in the reassembly key so the two TCP sequence spaces never mix.
                  foreach (var chunk in reassembler.Push(direction, tcp.SequenceNumber, tcp.PayloadData))
                  foreach (var d in decoder.Decode(chunk, DateTime.UtcNow))
                      EventReceived?.Invoke(new CombatEvent(DateTime.UtcNow, d.Kind, d.SourceId, d.Source,
                          d.TargetId, d.Target, d.Skill, d.Amount, d.DamageType,
                          d.CurrentHp, d.MaxHp, d.Effect, d.Stacks));
              }

              public void Dispose()
              {
                  foreach (var d in devices)
                  {
                      try { d.StopCapture(); } catch { }
                      try { d.Close(); } catch { }
                  }
                  devices.Clear();
              }
          }
          '@
          Set-Content "src/Capture/LiveCaptureAdapter.cs" $capture

          $mainPath = "src/MainWindow.xaml.cs"
          $main = Get-Content $mainPath -Raw
          $eventNeedle = 'parsedEvents++;'
          $eventReplacement = 'parsedEvents++;' + [Environment]::NewLine + '                      if (e.Kind == CombatKind.Damage) damageEvents++;' + [Environment]::NewLine + '                      else if (e.Kind == CombatKind.Heal) healEvents++;' + [Environment]::NewLine + '                      else if (e.Kind == CombatKind.TargetHp) hpEvents++;' + [Environment]::NewLine + '                      else otherEvents++;'
          if ($main -notmatch 'if \(e\.Kind == CombatKind\.Damage\)') {
            $main = $main.Replace($eventNeedle, $eventReplacement)
          }
          Set-Content $mainPath $main

      - name: Add decoded event inspector
        shell: pwsh
        run: |
          $mainPath = "src/MainWindow.xaml.cs"
          $main = Get-Content $mainPath -Raw
          $main = $main.Replace('string activeFlow = "Waiting...";', 'string activeFlow = "Waiting...";' + [Environment]::NewLine + '              readonly Queue<string> eventInspector = new();')
          $oldApply = 'engine.Apply(e);'
          $newApply = @(
            '                      var before = engine.Snapshot();',
            '                      engine.Apply(e);',
            '                      var after = engine.Snapshot();',
