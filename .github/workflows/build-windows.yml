              '            if (len < 3 || len > 24 || i + 3 + len > d.Length) continue;',
              '            var bytes = d.Slice(i + 3, len);',
              '            bool valid = true;',
              '            for (int j = 0; j < bytes.Length; j++)',
              '            {',
              '                byte b = bytes[j];',
              '                if (!((b >= (byte)''A'' && b <= (byte)''Z'') || (b >= (byte)''a'' && b <= (byte)''z'') ||',
              '                      (b >= (byte)''0'' && b <= (byte)''9'') || b == (byte)''_'' || b == (byte)''-''))',
              '                { valid = false; break; }',
