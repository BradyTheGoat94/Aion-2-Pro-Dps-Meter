          $switchNew = '"bossHp" => TryBossHp(frame, p+2, utc),' + [Environment]::NewLine + '            "selfInfo" => ObserveIdentity(frame, p+2, utc, "selfInfo"),' + [Environment]::NewLine + '            "otherInfo" => ObserveIdentity(frame, p+2, utc, "otherInfo"),' + [Environment]::NewLine + '            "charLookup" => ObserveIdentity(frame, p+2, utc, "charLookup"),'
