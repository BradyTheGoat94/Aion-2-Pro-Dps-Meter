            '                Diagnostic?.Invoke(new(utc,"spawn-identity",$"Mapped spawn entity {entity} -> {spawnName}",d.Length));',
            '                return new(CombatKind.PlayerName,entity,spawnName,0,"","",0,DamageType.Unknown,0,0,"",0);',
            '            }',
