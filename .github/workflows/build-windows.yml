          $returnNew = 'var sourceName = ResolveName((long)actor, "Actor");' + [Environment]::NewLine + '        var targetName = ResolveName((long)target, "Target");' + [Environment]::NewLine + '        return new(CombatKind.Damage, actor, sourceName, target, targetName,'
          if ($s.Contains($returnOld)) { $s = $s.Replace($returnOld, $returnNew) }

          if ($s -notmatch 'private Aion2Decoded\? ObserveIdentity') {
            $helperLines = @(
              '    private sealed record PlayerIdentity(string Name, string ClassName);',
              '',
              '    private string ResolveName(long id, string fallback)',
              '        => identities.TryGetValue(id, out var x) ? x.Name : $"{fallback} {id}";',
              '',
              '    private Aion2Decoded? ObserveIdentity(ReadOnlySpan<byte> d, int p, DateTime utc, string packetKind)',
              '    {',
              '        int start = p;',
              '        if (!ReadV(d, ref p, out var rawId) || rawId == 0 || rawId > long.MaxValue) return null;',
              '        long id = (long)rawId;',
              '        string? best = null;',
              '        for (int i = p; i < d.Length; i++)',
              '        {',
              '            int max = Math.Min(24, d.Length - i);',
              '            for (int len = 3; len <= max; len++)',
              '            {',
              '                var slice = d.Slice(i, len);',
              '                bool printable = true;',
              '                for (int j = 0; j < slice.Length; j++)',
              '                    if (slice[j] < 0x20 || slice[j] > 0x7E) { printable = false; break; }',
              '                if (!printable) break;',
              '                var text = System.Text.Encoding.UTF8.GetString(slice);',
              '                if (text.All(ch => char.IsLetterOrDigit(ch) || ch == ''_'' || ch == ''-'' || ch == '' '')) best = text.Trim();',
              '            }',
              '        }',
              '        if (string.IsNullOrWhiteSpace(best) || best.Length < 3) { Diagnostic?.Invoke(new(utc,"identity",$"{packetKind} id={id} no validated name",d.Length)); return null; }',
              '        identities[id] = new PlayerIdentity(best, "Unknown");',
              '        Diagnostic?.Invoke(new(utc,"identity",$"{packetKind} id={id} name={best}",d.Length));',
              '        return new(CombatKind.PlayerName,id,best,0,"","",0,DamageType.Unknown,0,0,"",0);',
              '    }',
              ''
            )
            $helper = $helperLines -join [Environment]::NewLine
            $anchor = '    private static bool ReadV('
            if (-not $s.Contains($anchor)) { throw "ReadV anchor missing for identity helper" }
            $s = $s.Replace($anchor, $helper + [Environment]::NewLine + $anchor)
          }

          Set-Content $p $s
          $verify = Get-Content $p -Raw
          if ($verify -notmatch 'ObserveIdentity' -or $verify -notmatch 'Dictionary<long, PlayerIdentity>' -or $verify -notmatch 'ResolveName') {
            throw "Identity cache patch verification failed"
          }

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Restore
        run: dotnet restore src/Aion2DPSPro.csproj
      - name: Publish Windows x64
        run: dotnet publish src/Aion2DPSPro.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: Aion2DPSPro-win-x64
          path: publish/
          if-no-files-found: error
