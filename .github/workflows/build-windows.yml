      - name: Correct damage skill-field alignment
        shell: pwsh
        run: |
          $p = "src/Protocol/PacketDispatcher.cs"
          $s = Get-Content $p -Raw

          $pattern = 'if\s*\(\s*!ReadV\(d,\s*ref\s+p,\s*out\s+var\s+skill\)\s*\|\|\s*skill\s*==\s*0\s*\|\|\s*skill\s*>\s*200_000_000\s*\)\s*return\s+null\s*;'
          $replacement = 'if (!TryReadSkillField(d, ref p, out var skill)) return null;'
          $updated = [regex]::Replace($s, $pattern, $replacement, 1)

          if ($updated -eq $s -and $s -notmatch 'TryReadSkillField\(d,\s*ref\s+p') {
            throw "Could not locate damage skill read in generated PacketDispatcher.cs"
          }
          $s = $updated

          if ($s -notmatch 'private static bool TryReadSkillField') {
            $helperLines = @(
              '    private static bool TryReadSkillField(ReadOnlySpan<byte> d, ref int p, out int skill)',
              '    {',
              '        skill = 0;',
              '        for (int i = 0; i < 7 && p + i + 4 <= d.Length; i++)',
              '        {',
              '            int raw = d[p+i] | (d[p+i+1] << 8) | (d[p+i+2] << 16) | (d[p+i+3] << 24);',
              '            if (raw <= 0) continue;',
              '',
              '            int candidate = raw;',
              '            if (candidate >= 1_000_000 && candidate < 200_000_000)',
              '            {',
              '                skill = candidate;',
              '                p += i + 5;',
              '                return true;',
              '            }',
              '',
              '            if (raw % 100 == 0)',
              '            {',
              '                candidate = raw / 100;',
              '                if (candidate >= 1_000_000 && candidate < 200_000_000)',
              '                {',
              '                    skill = candidate;',
              '                    p += i + 5;',
              '                    return true;',
              '                }',
              '            }',
              '        }',
              '        return false;',
              '    }',
              ''
            )
            $helper = $helperLines -join [Environment]::NewLine
            $anchor = '    private static bool ReadV('
            if (-not $s.Contains($anchor)) {
              throw "ReadV anchor missing in PacketDispatcher.cs"
            }
            $s = $s.Replace($anchor, $helper + [Environment]::NewLine + $anchor)
          }

          Set-Content $p $s

          $verify = Get-Content $p -Raw
          if ($verify -notmatch 'TryReadSkillField\(d,\s*ref\s+p') {
            throw "Damage parser verification failed"
          }

      - name: Add post-skill damage candidate tracing
        shell: pwsh
        run: |
          $p = "src/Protocol/PacketDispatcher.cs"
          $s = Get-Content $p -Raw

          # Preserve the byte position reached by the corrected skill-field reader.
          $needle = 'if (!TryReadSkillField(d, ref p, out var skill)) return null;'
          if ($s.Contains($needle) -and $s -notmatch 'int postSkillPos = p;') {
            $s = $s.Replace($needle, $needle + [Environment]::NewLine + '        int postSkillPos = p;')
          }

          # Enrich only recognized damage validation records with candidate varints.
          $traceNeedle = 'ValidationRecord?.Invoke($"{utc:O}|tag={kind}|src={evt.SourceId}|tgt={evt.TargetId}|skill={evt.Skill}|amount={evt.Amount}|type={evt.DamageType}|raw={Convert.ToHexString(frame)}");'
          if ($s.Contains($traceNeedle)) {
            $traceReplacement = 'var candidates = kind == "damage" ? DescribeVarintCandidates(frame, FindPostSkillPosition(frame, p+2)) : "";' + [Environment]::NewLine + '      ValidationRecord?.Invoke($"{utc:O}|tag={kind}|src={evt.SourceId}|tgt={evt.TargetId}|skill={evt.Skill}|amount={evt.Amount}|type={evt.DamageType}|candidates={candidates}|raw={Convert.ToHexString(frame)}");'
            $s = $s.Replace($traceNeedle, $traceReplacement)
          }

          if ($s -notmatch 'private static string DescribeVarintCandidates') {
            $helperLines = @(
              '    private static int FindPostSkillPosition(ReadOnlySpan<byte> d, int p)',
              '    {',
              '        if (!ReadV(d, ref p, out _)) return -1;',
              '        if (!ReadV(d, ref p, out _)) return -1;',
              '        if (!ReadV(d, ref p, out _)) return -1;',
              '        if (!ReadV(d, ref p, out _)) return -1;',
              '        if (!TryReadSkillField(d, ref p, out _)) return -1;',
              '        return p;',
              '    }',
              '',
              '    private static string DescribeVarintCandidates(ReadOnlySpan<byte> d, int start)',
              '    {',
              '        if (start < 0 || start >= d.Length) return "none";',
              '        var parts = new List<string>();',
              '        int p = start;',
              '        for (int n = 0; n < 12 && p < d.Length; n++)',
              '        {',
              '            int at = p;',
              '            if (!ReadV(d, ref p, out var value)) break;',
              '            parts.Add($"{at}:{value}");',
              '        }',
              '        return string.Join(",", parts);',
              '    }',
              ''
            )
            $helper = $helperLines -join [Environment]::NewLine
            $anchor = '    private static bool ReadV('
            if (-not $s.Contains($anchor)) { throw "ReadV anchor missing for candidate tracer" }
            $s = $s.Replace($anchor, $helper + [Environment]::NewLine + $anchor)
          }

          Set-Content $p $s
          $verify = Get-Content $p -Raw
          if ($verify -notmatch 'DescribeVarintCandidates' -or $verify -notmatch 'candidates=') {
            throw "Candidate tracer verification failed"
          }

      - name: Correct damage amount field
        shell: pwsh
        run: |
          $p = "src/Protocol/PacketDispatcher.cs"
          $s = Get-Content $p -Raw

          # The current parser consumes one post-trailer varint and then calls the
          # next one damage. Validation shows that value is stable per actor and
          # the following varint is the varying hit amount, so advance once more.
          $pattern = 'if\s*\(\s*!ReadV\(d,\s*ref\s+p,\s*out\s+_\)\s*\)\s*return\s+null\s*;\s*if\s*\(\s*!ReadV\(d,\s*ref\s+p,\s*out\s+var\s+damage\)\s*\|\|\s*damage\s*==\s*0\s*\|\|\s*damage\s*>\s*9_000_000_000UL\s*\)\s*return\s+null\s*;'
          $replacement = 'if (!ReadV(d, ref p, out _)) return null;' + [Environment]::NewLine + '        if (!ReadV(d, ref p, out _)) return null;' + [Environment]::NewLine + '        if (!ReadV(d, ref p, out var damage) || damage==0 || damage>9_000_000_000UL) return null;'
          $updated = [regex]::Replace($s, $pattern, $replacement, 1)

          if ($updated -eq $s -and $s -notmatch 'if \(!ReadV\(d, ref p, out _\)\) return null;\s*if \(!ReadV\(d, ref p, out _\)\) return null;\s*if \(!ReadV\(d, ref p, out var damage\)') {
            throw "Could not locate damage amount read sequence"
