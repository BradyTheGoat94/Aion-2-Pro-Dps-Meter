name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "src/**"
      - "Aion2DPSPro-FirstLiveParser-v5.zip"
      - ".github/workflows/build-windows.yml"

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Expand source archive when needed
        shell: pwsh
        run: |
          if (-not (Test-Path "src/Aion2DPSPro.csproj")) {
            if (-not (Test-Path "Aion2DPSPro-FirstLiveParser-v5.zip")) { throw "Source project or v5 source ZIP not found." }
            Expand-Archive -Path "Aion2DPSPro-FirstLiveParser-v5.zip" -DestinationPath "." -Force
          }
      - name: Apply build fixes
        shell: pwsh
        run: |
          $replay = "src/Protocol/ReplayRecorder.cs"
          $text = Get-Content $replay -Raw
          if ($text -notmatch 'using System.IO;') {
            Set-Content $replay ("using System.IO;" + [Environment]::NewLine + $text)
          }
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Restore
        run: dotnet restore src/Aion2DPSPro.csproj
      - name: Publish Windows x64
        run: dotnet publish src/Aion2DPSPro.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: Aion2DPSPro-win-x64
          path: publish/
          if-no-files-found: error
